  // ---------- Calendario mensual ----------

  function calendarioCeldas(mesStr) {
    var partes = mesStr.split('-');
    var anio = +partes[0], mes = +partes[1];
    var primerDia = new Date(Date.UTC(anio, mes - 1, 1));
    var diasEnMes = new Date(Date.UTC(anio, mes, 0)).getUTCDate();
    var offset = (primerDia.getUTCDay() + 6) % 7; // semana empieza lunes
    var celdas = [];
    for (var i = 0; i < offset; i++) celdas.push(null);
    for (var d = 1; d <= diasEnMes; d++) {
      celdas.push(anio + '-' + (mes < 10 ? '0' : '') + mes + '-' + (d < 10 ? '0' : '') + d);
    }
    return celdas;
  }

  VISTAS.calendario = function () {
    var d = S.d;
    S.calMes = S.calMes || d.hoy.slice(0, 7);
    var celdas = calendarioCeldas(S.calMes);
    var partesMes = S.calMes.split('-');
    var etiquetaMes = MESES[+partesMes[1] - 1] + ' ' + partesMes[0];
    var activos = {};
    d.proyectos.forEach(function (p) { if (p.estado === 'activo') activos[p.id] = true; });
    var tareas = d.tareas.filter(function (t) { return activos[t.proyectoId] && t.estado !== 'cancelada'; });

    function infoDia(iso) {
      return {
        tareas: tareas.filter(function (t) { return t.fechaInicio <= iso && (t.fechaTermino || t.fechaInicio) >= iso; }),
        citas: d.citas.filter(function (c) { return c.inicio.slice(0, 10) === iso; }),
        feriado: (d.feriados || []).indexOf(iso) >= 0,
        excepcion: d.excepciones.filter(function (e) { return e.fecha === iso; })[0] || null
      };
    }

    var h = [volver('Más', 'ir', ' data-vista="mas"'), cabecera('Calendario')];
    h.push('<div class="cal-nav"><button class="btn btn-chico" data-a="calMes" data-dir="-1" aria-label="Mes anterior">‹</button>' +
      '<strong>' + esc(etiquetaMes) + '</strong>' +
      '<button class="btn btn-chico" data-a="calMes" data-dir="1" aria-label="Mes siguiente">›</button></div>');
    h.push('<div class="cal-semana">' + ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(function (x) {
      return '<span>' + x + '</span>';
    }).join('') + '</div>');
    h.push('<div class="cal-grid">' + celdas.map(function (iso) {
      if (!iso) return '<div class="cal-celda cal-vacia"></div>';
      var info = infoDia(iso);
      var clases = 'cal-celda' + (iso === d.hoy ? ' cal-hoy' : '') + (iso === (S.calDia || d.hoy) ? ' cal-elegido' : '') +
        (info.excepcion ? (info.excepcion.tipo === 'no_trabaja' ? ' cal-no-trabaja' : ' cal-trabaja') : '');
      var puntos = [];
      if (info.tareas.length) puntos.push('<span class="cal-punto cal-punto-tarea"></span>');
      if (info.citas.length) puntos.push('<span class="cal-punto cal-punto-cita"></span>');
      if (info.feriado) puntos.push('<span class="cal-punto cal-punto-feriado"></span>');
      return '<button class="' + clases + '" data-a="calElegirDia" data-dia="' + iso + '">' +
        '<span class="cal-num">' + (+iso.slice(8, 10)) + '</span><span class="cal-puntos">' + puntos.join('') + '</span></button>';
    }).join('') + '</div>');

    var dia = S.calDia || d.hoy;
    if (S.calMes === dia.slice(0, 7)) {
      var info = infoDia(dia);
      h.push(seccion(fechaLarga(dia)));
      if (info.feriado) h.push('<p class="ayuda">Feriado.</p>');
      if (info.excepcion) {
        h.push('<p class="ayuda">' + esc(info.excepcion.tipo === 'trabaja' ? 'Ese día se trabaja' : 'Ese día no se trabaja') +
          (info.excepcion.motivo ? ': ' + esc(info.excepcion.motivo) : '') + '.</p>');
      }
      h.push(info.tareas.length ? grupos(info.tareas) : vacio('Sin tareas ese día.'));
      if (info.citas.length) {
        h.push(seccion('Citas', info.citas.length));
        h.push('<div class="lista">' + info.citas.map(itemCita).join('') + '</div>');
      }
    }
    return h.join('');
  };

  ACC.calMes = function (el) {
    var partes = S.calMes.split('-');
    var anio = +partes[0], mes = +partes[1] + (+el.dataset.dir);
    if (mes < 1) { mes = 12; anio--; } else if (mes > 12) { mes = 1; anio++; }
    S.calMes = anio + '-' + (mes < 10 ? '0' : '') + mes;
    render(true);
  };
  ACC.calElegirDia = function (el) { S.calDia = el.dataset.dia; render(true); };

  // ---------- Buscador global ----------

  function normalizarBusqueda(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function resultadosBusqueda(qOriginal) {
    var q = normalizarBusqueda((qOriginal || '').trim());
    if (q.length < 2) return vacio('Escribe al menos 2 letras para buscar.');
    var d = S.d;
    var grupos = [];

    var proyectos = d.proyectos.filter(function (p) { return normalizarBusqueda([p.nombre, p.cliente, p.direccion].join(' ')).indexOf(q) >= 0; });
    if (proyectos.length) grupos.push(['Proyectos', proyectos.map(function (p) {
      return '<button class="item" data-a="abrirProyecto" data-id="' + p.id + '"><span class="principal"><span class="nombre">' + esc(p.nombre) + '</span>' +
        (p.cliente || p.direccion ? '<span class="detalle">' + esc([p.cliente, p.direccion].filter(Boolean).join(', ')) + '</span>' : '') + '</span><span class="lado">›</span></button>';
    })]);

    var tareas = d.tareas.filter(function (t) { return normalizarBusqueda([t.titulo, t.descripcion].join(' ')).indexOf(q) >= 0; }).slice(0, 30);
    if (tareas.length) grupos.push(['Tareas', tareas.map(function (t) {
      var p = proyecto(t.proyectoId);
      return '<button class="item" data-a="verTarea" data-id="' + t.id + '"><span class="principal"><span class="nombre">' + esc(t.titulo) + '</span>' +
        '<span class="detalle">' + esc(p ? p.nombre : '') + '</span></span><span class="lado">›</span></button>';
    })]);

    var compras = d.compras.filter(function (c) { return normalizarBusqueda([c.descripcion, c.proveedor].join(' ')).indexOf(q) >= 0; }).slice(0, 30);
    if (compras.length) grupos.push(['Compras', compras.map(function (c) {
      var p = proyecto(c.proyectoId);
      return '<button class="item" data-a="irBusquedaCompra" data-id="' + c.id + '"><span class="principal"><span class="nombre">' + esc(c.descripcion) + '</span>' +
        '<span class="detalle">' + esc(p ? p.nombre : '') + '</span></span><span class="lado">›</span></button>';
    })]);

    var trabajadores = d.trabajadores.filter(function (t) { return normalizarBusqueda(t.nombre).indexOf(q) >= 0; });
    if (trabajadores.length) grupos.push(['Trabajadores', trabajadores.map(function (t) {
      return '<button class="item" data-a="editarTrabajador" data-id="' + t.id + '"><span class="principal"><span class="nombre">' + esc(t.nombre) + '</span></span><span class="lado">›</span></button>';
    })]);

    var subs = d.subcontratistas.filter(function (s) { return normalizarBusqueda([s.nombre, s.especialidad].join(' ')).indexOf(q) >= 0; });
    if (subs.length) grupos.push(['Subcontratistas', subs.map(function (s) {
      return '<button class="item" data-a="editarSubcontratista" data-id="' + s.id + '"><span class="principal"><span class="nombre">' + esc(s.nombre) + '</span>' +
        '<span class="detalle">' + esc(s.especialidad) + '</span></span><span class="lado">›</span></button>';
    })]);

    var recursos = d.recursos.filter(function (r) { return normalizarBusqueda(r.nombre).indexOf(q) >= 0; });
    if (recursos.length) grupos.push(['Materiales y herramientas', recursos.map(function (r) {
      return '<button class="item" data-a="editarRecurso" data-id="' + r.id + '"><span class="principal"><span class="nombre">' + esc(r.nombre) + '</span></span><span class="lado">›</span></button>';
    })]);

    if (!grupos.length) return vacio('Sin resultados para «' + esc((qOriginal || '').trim()) + '».');
    return grupos.map(function (g) { return seccion(g[0], g[1].length) + '<div class="lista">' + g[1].join('') + '</div>'; }).join('');
  }

  VISTAS.buscar = function () {
    var h = [volver('Más', 'ir', ' data-vista="mas"'), cabecera('Buscar')];
    h.push('<label class="campo"><span>Proyectos, tareas, compras, trabajadores…</span>' +
      '<input id="buscar-input" type="search" inputmode="search" autocomplete="off" value="' + esc(S.buscarTexto || '') + '"></label>');
    h.push('<div id="buscar-resultados">' + resultadosBusqueda(S.buscarTexto) + '</div>');
    return h.join('');
  };

  ACC.irBusquedaCompra = function (el) {
    var c = porId(S.d.compras, el.dataset.id);
    if (!c) return;
    ir('proyecto', { proyectoId: c.proyectoId, pestana: 'compras' });
  };

  // ---------- Navegación ----------

  ACC.abrirProyecto = function (el) {
    cerrarModal();
    if (S.proyectoId !== el.dataset.id) S.pestana = 'tareas';
    ir('proyecto', { proyectoId: el.dataset.id });
  };
  ACC.pestana = function (el) { S.pestana = el.dataset.p; render(true); };
  ACC.filtroTareas = function (el) { S.filtroTareas = el.dataset.f; render(true); };
  ACC.filtroCompras = function (el) { S.filtroCompras = el.dataset.f; render(true); };
  ACC.irCompras = function (el) { ir('compras', { filtroCompras: el.dataset.filtro || 'aprobada' }); };
  ACC.verTerminados = function () { S.verTerminados = true; render(true); };

  /** Carga miniaturas pendientes de a una (evita saturar Apps Script). */
  function despuesDeRender() {
    var buscarInput = $('#buscar-input');
    if (buscarInput && !buscarInput._armado) {
      buscarInput._armado = true;
      buscarInput.addEventListener('input', function () {
        S.buscarTexto = buscarInput.value;
        var cont = $('#buscar-resultados');
        if (cont) cont.innerHTML = resultadosBusqueda(S.buscarTexto);
      });
    }
    $$('[data-mini]').forEach(function (el) {
      var listo = S.miniaturas[el.dataset.mini];
      if (listo) el.outerHTML = '<img src="' + listo + '" alt="">';
    });
    var pendiente = $('[data-mini]');
    if (!pendiente || S.cargandoMini) return;
    var id = pendiente.dataset.mini;
    S.cargandoMini = true;
    llamar('apiMiniatura', id).then(function (src) {
      S.miniaturas[id] = src || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#d5dadb"/></svg>');
    }).catch(function () {
      S.miniaturas[id] = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#d5dadb"/></svg>');
    }).then(function () {
      S.cargandoMini = false;
      despuesDeRender();
    });
  }
</script>

  <script>
  // =====================================================================
  // Piezas de formulario
  // =====================================================================

  function campo(etiquetaTxt, control) {
    return '<label class="campo"><span>' + esc(etiquetaTxt) + '</span>' + control + '</label>';
  }
  function input(nombre, valor, extra) {
    return '<input name="' + nombre + '" value="' + esc(valor === null || valor === undefined ? '' : valor) + '" ' + (extra || '') + '>';
  }
  // Ronda 11 (pedido de Kevin: "difícil saber si puse los 0 suficientes para representar
  // 1.500.000"): como input(), pero para un monto en pesos — el valor inicial ya se muestra con
  // puntos de miles (ej. editar una cotización de $1.500.000 no muestra "1500000") y el campo
  // queda marcado data-formato="miles" para que formatearMilesEnVivo (App.html) lo siga
  // reformateando en cada tecla. El servidor ya sabe leer ese formato (LibValidacion.aNumero).
  function inputMonto(nombre, valor, extra) {
    var inicial = (valor === null || valor === undefined || valor === '') ? '' : formatearMiles(valor);
    return input(nombre, inicial, 'data-formato="miles" ' + (extra || ''));
  }
  function area(nombre, valor, extra) {
    return '<textarea name="' + nombre + '" ' + (extra || '') + '>' + esc(valor || '') + '</textarea>';
  }
  function selector(nombre, opciones, valor, extra) {
    return '<select name="' + nombre + '" ' + (extra || '') + '>' + opciones.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(valor || '') ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
    }).join('') + '</select>';
  }
  function chips(nombre, opciones, seleccion, tipo) {
    tipo = tipo || 'checkbox';
    return '<div class="opciones">' + opciones.map(function (o) {
      var marcado = tipo === 'checkbox' ? (seleccion || []).indexOf(o[0]) >= 0 : String(seleccion) === String(o[0]);
      return '<label class="opcion"><input type="' + tipo + '" name="' + nombre + '" value="' + esc(o[0]) + '"' +
        (tipo === 'checkbox' ? ' data-lista="1"' : '') + (marcado ? ' checked' : '') + '><span>' + esc(o[1]) + '</span></label>';
    }).join('') + '</div>';
  }
  function opcionesProyectos(conVacio, textoVacio) {
    var l = S.d.proyectos.filter(function (p) { return p.estado !== 'terminado'; }).map(function (p) { return [p.id, p.nombre]; });
    return conVacio ? [['', textoVacio || 'Sin proyecto']].concat(l) : l;
  }
  function opcionesTrabajadores() {
    return S.d.trabajadores.filter(function (t) { return t.activo; }).map(function (t) { return [t.id, t.nombre]; });
  }
  function botones(principal, extra) {
    return '<div class="barra-botones"><button type="submit" class="btn btn-primario">' + esc(principal) + '</button>' + (extra || '') + '</div>';
  }

  // =====================================================================
  // Proyectos
  // =====================================================================

  var DIAS_SEMANA = [['L', 'Lun'], ['M', 'Mar'], ['X', 'Mié'], ['J', 'Jue'], ['V', 'Vie'], ['S', 'Sáb'], ['D', 'Dom']];

  function formProyecto(p) {
    p = p || { estado: 'activo', diasLaborables: 'L,M,X,J,V' };
    return '<form data-form="proyecto">' +
      (p.id ? '<input type="hidden" name="id" value="' + p.id + '">' : '') +
      campo('Nombre', input('nombre', p.nombre, 'required maxlength="120" autocomplete="off"')) +
      campo('Cliente', input('cliente', p.cliente, 'maxlength="120"')) +
      campo('Dirección', input('direccion', p.direccion, 'maxlength="200"')) +
      '<div class="fila-campos">' +
      campo('Inicio', input('fechaInicio', p.fechaInicio, 'type="date"')) +
      campo('Término', input('fechaTermino', p.fechaTermino, 'type="date"')) +
      '</div>' +
      '<div class="campo"><span>Días que se trabaja</span>' + chips('diasLaborables', DIAS_SEMANA, String(p.diasLaborables || '').split(',')) + '</div>' +
      campo('Estado', selector('estado', [['activo', 'Activo'], ['pausado', 'Pausado'], ['terminado', 'Terminado']], p.estado)) +
      campo('Presupuesto total (opcional)', inputMonto('presupuestoTotal', p.presupuestoTotal, 'inputmode="numeric"')) +
      '<label class="interruptor"><input type="checkbox" name="invitarTareas"' + (p.invitarTareas ? ' checked' : '') + '> Enviar cada tarea como invitación a mi calendario</label>' +
      campo('Notas', area('notas', p.notas, 'rows="3"')) +
      botones(p.id ? 'Guardar cambios' : 'Crear proyecto') +
      '</form>';
  }

  ACC.nuevoProyecto = function () { abrirModal('Nuevo proyecto', formProyecto(null)); };

  FORM.proyecto = function (f, d, boton) {
    d.diasLaborables = (d.diasLaborables || []).join(',');
    if (!d.diasLaborables) { aviso('Marca al menos un día de trabajo.', { tipo: 'error' }); return; }
    hacer(boton, llamar('apiGuardarProyecto', d)).then(function (p) {
      var nuevo = !porId(S.d.proyectos, p.id);
      upsert(S.d.proyectos, p);
      S.d.trabajaManana[p.id] = S.d.trabajaManana[p.id] !== false;
      cerrarModal();
      if (nuevo) {
        aviso('Proyecto creado');
        ir('proyecto', { proyectoId: p.id, pestana: 'tareas' });
      } else {
        aviso('Cambios guardados');
        render(true);
      }
    }).catch(ignorar);
  };

  ACC.eliminarProyecto = function (el) {
    var p = proyecto(el.dataset.id);
    if (!confirmar('¿Eliminar el proyecto «' + p.nombre + '»? Sus tareas dejarán de verse. Los archivos quedan en Drive.')) return;
    hacer(el, llamar('apiEliminarProyecto', p.id)).then(function () {
      quitar(S.d.proyectos, p.id);
      S.d.tareas = S.d.tareas.filter(function (t) { return t.proyectoId !== p.id; });
      aviso('Proyecto eliminado');
      ir('proyectos');
    }).catch(ignorar);
  };

  // =====================================================================
  // Tareas
  // =====================================================================

  function formTarea(t, proyectoId) {
    t = t || { proyectoId: proyectoId, fechaInicio: S.d.hoy, fechaTermino: S.d.hoy, prioridad: 'media' };
    var asignados = t.id ? trabajadoresDe(t.id).map(function (x) { return x.id; }) : [];
    var det = S.detalles[t.proyectoId];
    var partidas = det ? det.partidas.filter(function (x) { return x.cantidad !== null || x.total !== null; }) : [];
    var trabajadores = opcionesTrabajadores();
    return '<form data-form="tarea">' +
      (t.id ? '<input type="hidden" name="id" value="' + t.id + '"><input type="hidden" name="proyectoId" value="' + t.proyectoId + '">'
        : campo('Proyecto', selector('proyectoId', opcionesProyectos(false), t.proyectoId, 'required'))) +
      campo('Qué hay que hacer', input('titulo', t.titulo, 'required maxlength="160" autocomplete="off"')) +
      campo('Detalle (opcional)', area('descripcion', t.descripcion, 'rows="2"')) +
      '<div class="fila-campos">' +
      campo('Desde', input('fechaInicio', t.fechaInicio, 'type="date" required')) +
      campo('Hasta', input('fechaTermino', t.fechaTermino, 'type="date" required')) +
      '</div>' +
      '<div class="fila-campos">' +
      campo('Hora (opcional, si hay que llegar a una hora puntual)', input('hora', t.hora, 'type="time"')) +
      campo('Avisar antes (minutos, opcional)', input('minutosAntes', t.minutosAntes, 'type="number" min="1" max="1440" placeholder="' + (S.d.config.recordatorioMinutosDefecto || 15) + '"')) +
      '</div>' +
      (t.hora ? '' : '<p class="ayuda">Si pones una hora, además del resumen del día se manda un aviso aparte justo antes.</p>') +
      '<div class="campo"><span>Quién</span>' + (trabajadores.length ? chips('trabajadorIds', trabajadores, asignados)
        : '<p class="ayuda">Aún no hay trabajadores. Agrégalos en Más, Trabajadores.</p>') + '</div>' +
      '<div class="campo"><span>Prioridad</span>' + chips('prioridad', [['alta', 'Alta'], ['media', 'Normal'], ['baja', 'Baja']], t.prioridad || 'media', 'radio') + '</div>' +
      (partidas.length ? campo('Partida del itemizado (opcional)', selector('partidaId', [['', 'Ninguna']].concat(partidas.map(function (x) {
        return [x.id, (x.codigo ? x.codigo + ' ' : '') + x.descripcion];
      })), t.partidaId)) : '') +
      botones(t.id ? 'Guardar cambios' : 'Crear tarea') +
      '</form>';
  }

  ACC.nuevaTarea = function (el) {
    if (!S.d.proyectos.length) { aviso('Primero crea un proyecto.', { tipo: 'error' }); return; }
    var pid = el.dataset.proyecto || (S.vista === 'proyecto' ? S.proyectoId : S.d.proyectos[0].id);
    abrirModal('Nueva tarea', formTarea(null, pid));
    $('#modal input[name=titulo]').focus();
  };

  ACC.editarTarea = function (el) {
    abrirModal('Editar tarea', formTarea(porId(S.d.tareas, el.dataset.id)));
  };

  FORM.tarea = function (f, d, boton) {
    if (d.fechaTermino < d.fechaInicio) { aviso('La fecha "hasta" es anterior a "desde".', { tipo: 'error' }); return; }
    hacer(boton, llamar('apiGuardarTarea', d)).then(function (r) {
      upsert(S.d.tareas, r.tarea);
      S.d.asignaciones = S.d.asignaciones.filter(function (a) { return a.tareaId !== r.tarea.id; }).concat(r.asignaciones);
      if (d.id) {
        verTarea(r.tarea.id);
      } else {
        cerrarModal();
        aviso('Tarea creada');
      }
      render(true);
    }).catch(ignorar);
  };

  ACC.toggleTarea = function (el) {
    var t = porId(S.d.tareas, el.dataset.id);
    if (!t) return;
    var antes = { estado: t.estado, resueltaEn: t.resueltaEn };
    var nuevo = t.estado === 'resuelta' ? 'pendiente' : 'resuelta';
    t.estado = nuevo;
    t.resueltaEn = nuevo === 'resuelta' ? S.d.hoy + 'T00:00:00' : '';
    render(true);
    llamar('apiCambiarEstadoTarea', t.id, nuevo).then(function (actual) {
      upsert(S.d.tareas, actual);
      delete S.detalles[t.proyectoId]; // el % de avance y la bitácora del proyecto quedan desactualizados si no se refresca
      if (nuevo === 'resuelta') aviso('Resuelta: ' + actual.titulo);
      if (S.vista === 'proyecto' && S.proyectoId === t.proyectoId) render(true);
    }).catch(function (e) {
      t.estado = antes.estado;
      t.resueltaEn = antes.resueltaEn;
      render(true);
      aviso(e.message, { tipo: 'error' });
    });
  };

  ACC.verTarea = function (el) { verTarea(el.dataset.id); };

  function verTarea(id) {
    var t = porId(S.d.tareas, id);
    if (!t) { aviso('La tarea ya no está disponible.', { tipo: 'error' }); return; }
    S.tareaAbierta = id;
    var p = proyecto(t.proyectoId);
    var det = S.detalles[t.proyectoId];
    if (!det) {
      llamar('apiDetalleProyecto', t.proyectoId).then(function (r) {
        S.detalles[t.proyectoId] = r;
        if (S.tareaAbierta === id && !$('#modal').hidden) verTarea(id);
      }).catch(function (e) { aviso(e.message, { tipo: 'error' }); });
    }
    // Ronda 8: "Sin asignar" también debe considerar a un subcontratista responsable (cotización
    // elegida), no solo trabajadores internos — si no, quedaba en rojo "Sin asignar" aunque más
    // abajo, en Cotizaciones, ya hubiera alguien marcado "Responsable" (bug real de Kevin).
    var quienes = trabajadoresDe(t.id).map(function (x) { return esc(x.nombre); })
      .concat(responsablesDe(t.id).map(function (s) { return esc(s.nombre) + ' (subcontratista)'; }))
      .join(', ');
    var rango = t.fechaInicio === t.fechaTermino ? 'Para ' + etiqueta(t.fechaInicio) : 'Desde ' + etiqueta(t.fechaInicio) + ' hasta ' + etiqueta(t.fechaTermino);
    if (t.hora) rango += ', ' + t.hora;
    var h = [];
    h.push('<p style="margin:0 0 6px"><button class="btn btn-plano btn-chico" style="padding-left:0" data-a="abrirProyecto" data-id="' + p.id + '">' + esc(p.nombre) + '</button></p>');
    h.push('<p style="margin:4px 0"><strong>' + esc(rango) + '</strong>' + (t.prioridad === 'alta' ? ' <span class="chip chip-rojo">Prioridad alta</span>' : '') +
      (t.hora ? ' <span class="chip chip-azul">Aviso ' + (Number(t.minutosAntes) > 0 ? t.minutosAntes : S.d.config.recordatorioMinutosDefecto) + ' min antes</span>' : '') + '</p>');
    h.push('<p style="margin:4px 0">' + (quienes || '<span style="color:var(--rojo)">Sin asignar</span>') + '</p>');
    if (t.descripcion) h.push('<p style="white-space:pre-wrap">' + esc(t.descripcion) + '</p>');
    h.push('<div class="segmentos">' + [['pendiente', 'Pendiente'], ['en_curso', 'En curso'], ['resuelta', 'Resuelta']].map(function (x) {
      return '<button data-a="estadoTarea" data-id="' + t.id + '" data-estado="' + x[0] + '" aria-current="' + (t.estado === x[0]) + '">' + x[1] + '</button>';
    }).join('') + '</div>');
    h.push('<div class="barra-botones"><button class="btn" data-a="editarTarea" data-id="' + t.id + '">Editar</button>' +
      '<button class="btn" data-a="subirArchivo" data-tipo="foto" data-tarea="' + t.id + '" data-proyecto="' + t.proyectoId + '">Subir fotos</button></div>');

    h.push(seccion('Cotizaciones de subcontratistas'));
    var cotizaciones = S.d.cotizaciones.filter(function (c) { return c.tareaId === t.id; })
      .slice().sort(function (a, b) { return (Number(a.monto) || 0) - (Number(b.monto) || 0); });
    if (cotizaciones.length) {
      h.push('<div class="lista">' + cotizaciones.map(function (c) {
        var sc = porId(S.d.subcontratistas, c.subcontratistaId);
        var nProy = S.d.subcontratistasProyectos.filter(function (r) { return r.subcontratistaId === c.subcontratistaId; }).length;
        // Ronda 10: una cotización en 0 (tarea del mismo subcontratista sin cobro aparte, ver
        // formCotizacion) no debe mostrarse como "$0 (incluye IVA)" — se deja explícito.
        var montoTxt = Number(c.monto) ? pesos(c.monto) + (c.incluyeIva ? ' (incluye IVA)' : ' + IVA') : 'Sin cobro aparte';
        var lineas = [montoTxt, nProy ? nProy + ' proyecto' + (nProy === 1 ? '' : 's') + ' juntos' : '', c.nota].filter(Boolean).join(' — ');
        var acciones;
        if (c.elegida) {
          acciones = c.pagado
            ? '<span class="chip chip-verde">Pago finalizado</span>'
            : '<button class="btn btn-chico" data-a="pagarCotizacion" data-id="' + c.id + '">Pagar</button>' +
              '<button class="btn btn-chico btn-plano" data-a="finalizarPagoCotizacion" data-id="' + c.id + '">Finalizar pago</button>';
        } else {
          acciones = '<button class="btn btn-chico" data-a="elegirCotizacion" data-id="' + c.id + '">Elegir</button>';
        }
        return '<div class="item"><span class="principal"><span class="nombre">' + esc(sc ? sc.nombre : 'Subcontratista eliminado') +
          (c.elegida ? ' <span class="chip chip-azul">Responsable</span>' : '') + '</span>' +
          '<span class="detalle">' + esc(lineas) + '</span>' +
          (c.elegida ? '<span class="detalle">' + esc(textoTratoCotizacion(c)) + '</span>' : '') + '</span>' +
          '<span class="acciones">' + acciones +
          '<button class="btn btn-chico btn-plano" data-a="editarCotizacion" data-id="' + c.id + '" aria-label="Editar">Editar</button>' +
          '<button class="btn btn-chico btn-plano" data-a="eliminarCotizacion" data-id="' + c.id + '" aria-label="Eliminar">✕</button></span></div>';
      }).join('') + '</div>');
    } else {
      h.push(vacio('Aún no tienes cotizaciones para esta tarea. Anota cuánto cobraría cada subcontratista para comparar.'));
    }
    if (S.d.subcontratistas.length) {
      h.push(formCotizacion(t.id, null));
    } else {
      h.push('<p class="ayuda">Agrega subcontratistas en Más, Subcontratistas, para poder comparar cotizaciones aquí.</p>');
    }

    h.push(seccion('Materiales y herramientas'));
    if (!det) {
      h.push(vacio('Cargando…'));
    } else {
      var trs = det.tareaRecursos.filter(function (r) { return r.tareaId === t.id; });
      var compras = S.d.compras.filter(function (c) { return c.tareaId === t.id && !c.recursoId; });
      if (trs.length || compras.length) {
        h.push('<div class="lista">' + trs.map(function (r) {
          var rec = porId(S.d.recursos, r.recursoId);
          return '<div class="item"><span class="principal"><span class="nombre">' + esc(rec ? rec.nombre : 'Recurso') + '</span>' +
            '<span class="detalle">' + esc([r.cantidad !== null ? numero(r.cantidad) : '', r.unidad].filter(Boolean).join(' ')) + '</span></span>' +
            '<span class="chip ' + (r.estado === 'falta' ? 'chip-rojo' : 'chip-verde') + '">' + (r.estado === 'falta' ? 'Falta' : 'Asignado') + '</span>' +
            '<button class="btn btn-chico btn-plano" data-a="quitarRecurso" data-id="' + r.id + '" aria-label="Quitar">✕</button></div>';
        }).join('') + compras.map(function (c) {
          return '<div class="item"><span class="principal"><span class="nombre">' + esc(c.descripcion) + '</span>' +
            '<span class="detalle">' + esc([c.cantidad !== null ? numero(c.cantidad) : '', c.unidad].filter(Boolean).join(' ')) + '</span></span>' +
            '<span class="chip chip-amarillo">' + ({ sugerida: 'Sugerida', aprobada: 'Por comprar', comprada: 'Comprada' }[c.estado] || c.estado) + '</span></div>';
        }).join('') + '</div>');
      } else {
        h.push(vacio('Nada asignado todavía.'));
      }
      h.push('<div class="barra-botones">' +
        (S.d.config.iaDisponible ? '<button class="btn" data-a="sugerirMateriales" data-id="' + t.id + '">Sugerir con IA</button>' : '') +
        '<button class="btn" data-a="agregarRecurso" data-id="' + t.id + '">Agregar</button></div>');

      var fotos = det.archivos.filter(function (a) { return a.tareaId === t.id; });
      if (fotos.length) {
        h.push(seccion('Fotos y archivos', fotos.length));
        h.push('<div class="galeria">' + fotos.map(miniatura).join('') + '</div>');
      }

      h.push(seccion('Notas'));
      h.push('<form data-form="nota"><input type="hidden" name="tareaId" value="' + t.id + '">' +
        campo('Nueva nota', area('texto', '', 'rows="2" required')) +
        '<button type="submit" class="btn">Guardar nota</button></form>');
      h.push(det.notas.filter(function (n) { return n.tareaId === t.id; }).map(function (n) { return itemNota(n, false); }).join(''));
    }
    h.push('<div class="barra-botones" style="margin-top:24px"><button class="btn btn-peligro" data-a="eliminarTarea" data-id="' + t.id + '">Eliminar tarea</button></div>');
    abrirModal(t.titulo, h.join(''));
    despuesDeRender();
  }

  ACC.estadoTarea = function (el) {
    hacer(el, llamar('apiCambiarEstadoTarea', el.dataset.id, el.dataset.estado)).then(function (t) {
      upsert(S.d.tareas, t);
      delete S.detalles[t.proyectoId];
      render(true);
      verTarea(t.id);
    }).catch(ignorar);
  };

  ACC.eliminarTarea = function (el) {
    var t = porId(S.d.tareas, el.dataset.id);
    if (!confirmar('¿Eliminar la tarea «' + t.titulo + '»?')) return;
    hacer(el, llamar('apiEliminarTarea', t.id)).then(function () {
      quitar(S.d.tareas, t.id);
      cerrarModal();
      render(true);
      aviso('Tarea eliminada');
    }).catch(ignorar);
  };

  // =====================================================================
  // Cotizaciones de subcontratistas (por tarea)
  // =====================================================================

  /**
   * Formulario para agregar (c=null) o editar (c=cotización existente) una cotización. Editar
   * permite corregir cualquier campo, incluido el subcontratista (Ronda 8: "si me equivoco de
   * contratista tampoco puedo cambiarlo" — antes solo se podía agregar una cotización nueva del
   * subcontratista correcto y elegirla aparte). El atajo "marcarlo de una vez como responsable"
   * solo tiene sentido al agregar una cotización nueva, no al editar una ya existente.
   */
  function formCotizacion(tareaId, c) {
    c = c || null;
    // Ronda 10 (pedido de Kevin: "tengo 2-3 tareas que las realiza el subcontrato y solo a 1 le
    // asigno el valor que cobro, las otras quiero asignarlas como 0... sin necesidad de estar
    // dividiendo el valor"): checkbox "no cobra aparte" que deja el monto en 0 de un toque, en vez
    // de tener que escribir 0 a mano (y repartir el cobro real entre las tareas ya no es necesario).
    var sinCobro = !!(c && !Number(c.monto));
    return '<form data-form="cotizacion">' +
      (c ? '<input type="hidden" name="id" value="' + c.id + '">' : '') +
      '<input type="hidden" name="tareaId" value="' + tareaId + '">' +
      campo('Subcontratista', selector('subcontratistaId', S.d.subcontratistas.filter(function (s) { return s.activo || (c && s.id === c.subcontratistaId); })
        .map(function (s) { return [s.id, s.nombre + ' (' + s.especialidad + ')']; }), c ? c.subcontratistaId : '')) +
      '<div class="fila-campos">' + campo('Cuánto cobraría', inputMonto('monto', c ? c.monto : '', 'inputmode="numeric" required' + (sinCobro ? ' readonly' : ''))) +
      campo('Nota (opcional)', input('nota', c ? c.nota : '', 'maxlength="200"')) + '</div>' +
      '<label class="interruptor"><input type="checkbox" name="sinCobro" data-cambio="sinCobroCotizacion"' + (sinCobro ? ' checked' : '') +
      '> No cobra aparte por esta tarea (ya cobra en otra) — deja el monto en $0</label>' +
      '<div class="campo"><span>Ese monto</span>' + chips('incluyeIva', [['true', 'Incluye IVA'], ['false', 'Es neto (falta sumarle IVA)']], c ? String(c.incluyeIva !== false) : 'true', 'radio') + '</div>' +
      (c ? '' : '<label class="interruptor"><input type="checkbox" name="elegida"> Ya se sabe que es él/ella — marcarlo de una vez como responsable de esta tarea</label>') +
      botones(c ? 'Guardar cambios' : 'Agregar cotización') + '</form>';
  }

  // Ronda 10: al marcar/desmarcar "no cobra aparte" en formCotizacion, fija (o libera) el campo
  // monto en $0 sin que Kevin tenga que borrar y escribir nada a mano. Si se destilda, recupera lo
  // que había escrito antes (guardado en data-anterior) en vez de dejarlo vacío.
  CAMBIO.sinCobroCotizacion = function (el) {
    var form = el.closest('form');
    var monto = form && form.querySelector('input[name=monto]');
    if (!monto) return;
    if (el.checked) {
      monto.dataset.anterior = monto.value;
      monto.value = '0';
      monto.readOnly = true;
    } else {
      monto.readOnly = false;
      monto.value = monto.dataset.anterior || '';
      delete monto.dataset.anterior;
    }
  };

  ACC.editarCotizacion = function (el) {
    var c = porId(S.d.cotizaciones, el.dataset.id);
    if (!c) return;
    abrirModal('Editar cotización', formCotizacion(c.tareaId, c));
  };

  FORM.cotizacion = function (f, d, boton) {
    delete d.sinCobro; // solo UI (ver CAMBIO.sinCobroCotizacion) — el servidor solo necesita el monto ya en 0
    d.incluyeIva = d.incluyeIva !== 'false';
    var editando = !!d.id;
    var anterior = editando ? porId(S.d.cotizaciones, d.id) : null;
    // Atajo "marcar de una vez como responsable" (solo al agregar): el servidor entonces devuelve
    // la lista completa de cotizaciones de la tarea (como apiElegirCotizacion), no un solo
    // registro — mismo criterio que ACC.elegirCotizacion, para que las demás cotizaciones de la
    // tarea queden desmarcadas también en el caché del cliente.
    var marcarElegida = !editando && (d.elegida === true || d.elegida === 'true');
    hacer(boton, llamar('apiGuardarCotizacion', d)).then(function (r) {
      if (marcarElegida) {
        S.d.cotizaciones = S.d.cotizaciones.filter(function (c) { return c.tareaId !== d.tareaId; }).concat(r);
      } else {
        upsert(S.d.cotizaciones, r);
      }
      // Si se editó y se corrigió el subcontratista, cualquier pago que ya se le hubiera
      // registrado (por esta tarea) al subcontratista anterior se actualiza también en el caché
      // local, para que quede coherente de inmediato — el servidor ya hizo lo mismo de verdad
      // (ver Cotizaciones.guardar_ en Tareas.js), esto solo evita tener que recargar para verlo.
      if (editando && anterior && anterior.subcontratistaId !== d.subcontratistaId) {
        S.d.pagosSubcontratistas.forEach(function (pago) {
          if (pago.tareaId === d.tareaId && pago.subcontratistaId === anterior.subcontratistaId) {
            pago.subcontratistaId = d.subcontratistaId;
          }
        });
      }
      var t = porId(S.d.tareas, d.tareaId);
      if (t) delete S.detalles[t.proyectoId];
      S.tareasSub = {};
      aviso(marcarElegida ? 'Asignado como responsable de la tarea' : (editando ? 'Cotización actualizada' : 'Cotización agregada'));
      if (S.tareaAbierta === d.tareaId) verTarea(d.tareaId);
      else { cerrarModal(); render(true); }
    }).catch(ignorar);
  };

  ACC.eliminarCotizacion = function (el) {
    var id = el.dataset.id;
    var c = porId(S.d.cotizaciones, id);
    var msg = '¿Eliminar esta cotización?';
    if (c) {
      var pagos = S.d.pagosSubcontratistas.filter(function (r) { return r.tareaId === c.tareaId && r.subcontratistaId === c.subcontratistaId; });
      if (pagos.length) {
        var total = pagos.reduce(function (s, r) { return s + (Number(r.monto) || 0); }, 0);
        msg = '¿Eliminar esta cotización? También se eliminarán ' + pagos.length + ' pago' + (pagos.length === 1 ? '' : 's') +
          ' registrado' + (pagos.length === 1 ? '' : 's') + ' por ' + pesos(total) + '.';
      }
    }
    if (!confirmar(msg)) return;
    hacer(el, llamar('apiEliminarCotizacion', id)).then(function (r) {
      quitar(S.d.cotizaciones, id);
      (r.pagosEliminados || []).forEach(function (pid) { quitar(S.d.pagosSubcontratistas, pid); });
      if (c) { var t = porId(S.d.tareas, c.tareaId); if (t) delete S.detalles[t.proyectoId]; }
      S.tareasSub = {};
      if (c && S.tareaAbierta === c.tareaId) verTarea(c.tareaId); else render(true);
    }).catch(ignorar);
  };

  ACC.elegirCotizacion = function (el) {
    hacer(el, llamar('apiElegirCotizacion', el.dataset.id)).then(function (lista) {
      var tareaId = lista.length ? lista[0].tareaId : S.tareaAbierta;
      S.d.cotizaciones = S.d.cotizaciones.filter(function (c) { return c.tareaId !== tareaId; }).concat(lista);
      var t = porId(S.d.tareas, tareaId);
      if (t) delete S.detalles[t.proyectoId];
      S.tareasSub = {};
      if (S.tareaAbierta === tareaId) verTarea(tareaId); else render(true);
    }).catch(ignorar);
  };

  ACC.pagarCotizacion = function (el) {
    var c = porId(S.d.cotizaciones, el.dataset.id);
    if (!c) return;
    var sc = porId(S.d.subcontratistas, c.subcontratistaId);
    var t = calcTratoCotizacion(c);
    abrirModal('Pagar' + (sc ? ': ' + sc.nombre : ''),
      (t ? '<p class="ayuda" style="margin-top:0">' + esc(textoTratoCotizacion(c)) + '</p>' : '') +
      '<form data-form="pagoCotizacion"><input type="hidden" name="tareaId" value="' + c.tareaId + '">' +
      '<input type="hidden" name="subcontratistaId" value="' + c.subcontratistaId + '">' +
      campo('% del total acordado (opcional)', input('porcentaje', '', 'inputmode="numeric" placeholder="Ej: 60" data-cambio="pctPago" data-total="' + (t ? t.conIva : 0) + '"')) +
      '<div class="fila-campos">' + campo('Monto', inputMonto('monto', '', 'inputmode="numeric" required')) +
      campo('Fecha', input('fecha', S.d.hoy, 'type="date"')) + '</div>' +
      campo('Nota (opcional)', input('nota', '', 'maxlength="300" placeholder="Adelanto, pago parcial…"')) +
      (t && t.saldo > 0.5 ? '<div class="barra-botones"><button type="button" class="btn btn-chico" data-a="pagarSaldo" data-saldo="' + Math.round(t.saldo) + '">Pagar el saldo restante (' + esc(pesos(t.saldo)) + ')</button></div>' : '') +
      botones('Registrar pago') + '</form>');
  };

  // Compartidos por el pago de una cotización (tarea puntual) y el pago del trato de proyecto
  // (ACC.pagarSubProyecto, más abajo): en ambos se puede indicar el monto directo o un % del
  // total acordado, para no tener que sacar la cuenta a mano — pedido explícito de Kevin. Ambos
  // fijan el campo por código (no por tecleo), así que no dispara el evento "input" que reformatea
  // en vivo (Ronda 11) — se formatea a mano con formatearMiles() antes de asignarlo.
  ACC.pagarSaldo = function (el) {
    var monto = el.closest('form').querySelector('input[name=monto]');
    if (monto) monto.value = formatearMiles(el.dataset.saldo);
  };

  CAMBIO.pctPago = function (el) {
    var pct = Number(el.value);
    var total = Number(el.dataset.total);
    if (!pct || !total) return;
    var monto = el.closest('form').querySelector('input[name=monto]');
    if (monto) monto.value = formatearMiles(Math.round(total * pct / 100));
  };

  FORM.pagoCotizacion = function (f, d, boton) {
    delete d.porcentaje;
    hacer(boton, llamar('apiRegistrarPagoSubcontratista', d)).then(function (r) {
      upsert(S.d.pagosSubcontratistas, r);
      if (r.proyectoId) delete S.detalles[r.proyectoId];
      aviso('Pago registrado');
      cerrarModal();
      if (S.tareaAbierta === d.tareaId) verTarea(d.tareaId); else render(true);
    }).catch(ignorar);
  };

  ACC.finalizarPagoCotizacion = function (el) {
    var c = porId(S.d.cotizaciones, el.dataset.id);
    if (c) {
      var t = calcTratoCotizacion(c);
      if (t && t.saldo > 0.5 && !confirmar('Aún queda un saldo de ' + pesos(t.saldo) + '. ¿Marcar el pago como finalizado igual?')) return;
    }
    hacer(el, llamar('apiMarcarCotizacionPagada', el.dataset.id)).then(function (r) {
      upsert(S.d.cotizaciones, r);
      var t2 = porId(S.d.tareas, r.tareaId);
      if (t2) delete S.detalles[t2.proyectoId];
      S.tareasSub = {};
      aviso('Pago finalizado');
      if (S.tareaAbierta === r.tareaId) verTarea(r.tareaId); else render(true);
    }).catch(ignorar);
  };

  // =====================================================================

  FORM.nota = function (f, d, boton) {
    hacer(boton, llamar('apiGuardarNota', d)).then(function (n) {
      var det = S.detalles[n.proyectoId];
      if (det) det.notas.unshift(n);

  ACC.eliminarNota = function (el) {
    if (!confirmar('¿Eliminar esta nota?')) return;
    var id = el.dataset.id;
    hacer(el, llamar('apiEliminarNota', id)).then(function () {
      Object.keys(S.detalles).forEach(function (pid) { quitar(S.detalles[pid].notas, id); });
      if (!$('#modal').hidden && S.tareaAbierta) verTarea(S.tareaAbierta); else render(true);
    }).catch(ignorar);

  // =====================================================================
  // Materiales y herramientas de una tarea
  // =====================================================================

  function aplicarRecursos(tareaId, items, boton) {
    var t = porId(S.d.tareas, tareaId);
    return hacer(boton, llamar('apiAsignarRecursos', tareaId, items)).then(function (r) {
      var det = S.detalles[t.proyectoId];
      if (det) det.tareaRecursos = det.tareaRecursos.filter(function (x) { return x.tareaId !== tareaId; }).concat(r.tareaRecursos);
      r.compras.forEach(function (c) { upsert(S.d.compras, c); });
      S.d.recursos = r.recursos;
      aviso(r.compras.length ? r.compras.length + ' ítem(s) quedaron por comprar' : 'Recursos asignados');
      verTarea(tareaId);
      render(true);
    });
  }

  ACC.sugerirMateriales = function (el) {
    var id = el.dataset.id;
    hacer(el, llamar('apiIaSugerirMateriales', id)).then(function (items) {
      if (!items.length) { aviso('La IA no sugirió materiales para esta tarea.'); return; }
      S.materiales = { tareaId: id, items: items };
      var h = ['<p class="ayuda">Elige qué asignar desde lo que ya tienes y qué hay que comprar.</p><form data-form="materiales">'];
      items.forEach(function (it, i) {
        h.push('<div class="accion ' + (it.disponible ? 'ok' : '') + '"><div class="accion-cabecera"><span><strong>' + esc(it.nombre) + '</strong>' +
          (it.motivo ? '<span class="detalle" style="color:var(--tinta-2);font-size:14px">' + esc(it.motivo) + '</span>' : '') + '</span></div>' +
          '<div class="fila-campos">' + campo('Cantidad', input('m' + i + '_cantidad', it.cantidad, 'inputmode="decimal"')) + campo('Unidad', input('m' + i + '_unidad', it.unidad)) + '</div>' +
          chips('m' + i + '_modo', [['asignar', it.recursoId ? 'Asignar (lo tengo)' : 'Asignar'], ['comprar', 'Comprar'], ['omitir', 'Omitir']], it.modo, 'radio') + '</div>');
      });
      h.push(botones('Guardar') + '</form>');
      abrirModal('Materiales sugeridos', h.join(''));
    }).catch(ignorar);
  };

  FORM.materiales = function (f, d, boton) {
    var m = S.materiales;
    var items = m.items.map(function (it, i) {
      return {
        recursoId: it.recursoId, nombre: it.nombre, tipo: it.tipo,
        cantidad: d['m' + i + '_cantidad'], unidad: d['m' + i + '_unidad'], modo: d['m' + i + '_modo']
      };
    }).filter(function (it) { return it.modo === 'asignar' || it.modo === 'comprar'; });
    if (!items.length) { verTarea(m.tareaId); return; }
    aplicarRecursos(m.tareaId, items, boton).catch(ignorar);
  };

  ACC.agregarRecurso = function (el) {
    var id = el.dataset.id;
    var opciones = [['', 'Otro (escribir abajo)']].concat(S.d.recursos.slice().sort(function (a, b) { return a.nombre < b.nombre ? -1 : 1; })
      .map(function (r) { return [r.id, r.nombre + (r.disponible ? '' : ' (no hay)')]; }));

  // =====================================================================
  // Archivos
  // =====================================================================

  /** Imagen → JPEG comprimido; PDF → tal cual. Devuelve {nombre, mime, base64}. */
  function prepararArchivo(archivo, tipo) {
    var max = S.d.config.archivoMaxMb;
    if (/^image\//.test(archivo.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(archivo.name)) {
      var lado = tipo === 'foto' || tipo === 'boleta' ? 1600 : 2400;
      return comprimirImagen(archivo, lado, tipo === 'foto' ? 0.8 : 0.85);
    }
    if (archivo.size > max * 1024 * 1024) return Promise.reject(new Error('El archivo pesa más de ' + max + ' MB.'));
    return leerBase64(archivo).then(function (b64) {
      return { nombre: archivo.name, mime: archivo.type || 'application/octet-stream', base64: b64 };
    });
  }

  ACC.subirArchivo = function (el) {
    var tipo = el.dataset.tipo;
    var proyectoId = el.dataset.proyecto;
    var tareaId = el.dataset.tarea || '';
    var accept = tipo === 'foto' ? 'image/*' : 'image/*,application/pdf';
    elegirArchivos(accept, tipo === 'foto').then(function (archivos) {
      var total = archivos.length, hechos = 0;
      var cadena = Promise.resolve();
      archivos.forEach(function (archivo, i) {
        cadena = cadena.then(function () {
          aviso('Subiendo ' + (i + 1) + ' de ' + total + '…', { ms: 60000 });
          var tipoFinal = tipo === 'foto' ? 'foto' : 'plano';
          return prepararArchivo(archivo, tipoFinal).then(function (b) {
            b.proyectoId = proyectoId;
            b.tareaId = tareaId;
            b.tipo = tipoFinal;
            return llamar('apiSubirArchivo', b);
          }).then(function (a) {
            hechos++;
            if (S.detalles[proyectoId]) S.detalles[proyectoId].archivos.unshift(a);
          });
        });
      });
      return cadena.then(function () {
        aviso(hechos === 1 ? 'Archivo guardado' : hechos + ' archivos guardados');
        if (tareaId && !$('#modal').hidden) verTarea(tareaId); else render(true);
      });
    }).catch(function (e) { aviso(e.message, { tipo: 'error' }); });
  };

  ACC.verArchivo = function (el) {
    var id = el.dataset.id;
    var ventana = null;
    try { ventana = window.open('', '_blank'); } catch (e) { ventana = null; }
    llamar('apiAbrirArchivo', id).then(function (url) {
      if (ventana && !ventana.closed) ventana.location.href = url;
      else aviso('Archivo listo', { accion: { texto: 'Abrir', fn: function () { window.open(url, '_blank'); } } });
    }).catch(function (e) {
      if (ventana) ventana.close();
      aviso(e.message, { tipo: 'error' });
    });
  };

      h.push('<div class="dudas">' + v.alertas.map(function (a) { return '<p>' + esc(a) + '</p>'; }).join('') +

    if (v.observaciones.length) h.push('<p class="ayuda">' + v.observaciones.map(esc).join('<br>') + '</p>');
    h.push('<form data-form="itemizado"><div class="tabla-wrap"><table class="partidas tabla-edit"><thead><tr>' +
      '<th>Ítem</th><th>Descripción</th><th>Unidad</th><th class="num">Cant.</th><th class="num">P.U.</th><th class="num">Total</th><th></th></tr></thead><tbody>');
    v.partidas.forEach(function (p, i) {
      h.push('<tr data-fila="' + i + '" class="' + (p.alertas.length ? 'con-alerta' : '') + '">' +
        '<td><input name="codigo" value="' + esc(p.codigo) + '" style="width:70px"></td>' +
        '<td><input class="desc" name="descripcion" value="' + esc(p.descripcion) + '">' +
        (p.alertas.length ? '<span class="alerta">' + p.alertas.map(esc).join('. ') + '</span>' : '') + '</td>' +
        '<td><input name="unidad" value="' + esc(p.unidad) + '" style="width:70px"></td>' +
        '<td><input name="cantidad" value="' + esc(p.cantidad === null ? '' : p.cantidad) + '" inputmode="decimal"></td>' +
        '<td><input name="precioUnitario" value="' + esc(p.precioUnitario === null ? '' : p.precioUnitario) + '" inputmode="decimal"></td>' +
        '<td><input name="total" value="' + esc(p.total === null ? '' : p.total) + '" inputmode="decimal"></td>' +
        '<td><button type="button" class="btn btn-chico btn-plano" data-a="quitarFila" aria-label="Quitar fila">✕</button></td></tr>');
    });
    h.push('</tbody></table></div>');
    h.push('<div class="total-linea"><span>Suma de partidas</span><span>' + esc(pesos(v.totalCalculado)) + '</span></div>');
    if (v.totalDocumento !== null) h.push('<p class="ayuda">Total del documento: ' + esc(pesos(v.totalDocumento)) + '</p>');
    if (existentes) h.push('<label class="interruptor"><input type="checkbox" name="reemplazar"> Reemplazar las ' + existentes + ' partidas actuales</label>');
    h.push(botones('Guardar itemizado'));
    h.push('</form>');
    abrirModal('Revisa el itemizado (' + v.partidas.length + ' filas)', h.join(''));
  }

  var NOMBRE_ACCION = {
    crear_tarea: 'Nueva tarea', asignar_trabajadores: 'Asignar trabajadores', marcar_resuelta: 'Marcar resuelta',
    cambiar_fechas: 'Cambiar fechas', agregar_nota: 'Nota', agregar_compra: 'Compra', crear_cita: 'Cita', excepcion_dia: 'Día especial'
  };

  function camposAccion(a, i) {
    var n = function (c) { return 'a' + i + '_' + c; };
    var trabajadores = opcionesTrabajadores();
    switch (a.tipo) {
      case 'crear_tarea':
        return campo('Proyecto', selector(n('proyectoId'), opcionesProyectos(true, 'Elegir proyecto'), a.proyectoId)) +
          campo('Título', input(n('titulo'), a.titulo)) +
          '<div class="fila-campos">' + campo('Desde', input(n('fechaInicio'), a.fechaInicio, 'type="date"')) + campo('Hasta', input(n('fechaTermino'), a.fechaTermino, 'type="date"')) + '</div>' +
          (trabajadores.length ? '<div class="campo"><span>Quién</span>' + chips(n('trabajadorIds'), trabajadores, a.trabajadorIds || []) + '</div>' : '') +
          ((a.recursos || []).length ? '<p class="ayuda">Materiales: ' + a.recursos.map(function (r) {
            return esc([r.cantidad, r.unidad, r.nombre].filter(function (x) { return x !== null && x !== ''; }).join(' '));
          }).join(', ') + '</p>' : '');
      case 'asignar_trabajadores':
        return trabajadores.length ? '<div class="campo"><span>Quién</span>' + chips(n('trabajadorIds'), trabajadores, a.trabajadorIds || []) + '</div>' : '';
      case 'cambiar_fechas':
        return '<div class="fila-campos">' + campo('Desde', input(n('fechaInicio'), a.fechaInicio, 'type="date"')) + campo('Hasta', input(n('fechaTermino'), a.fechaTermino, 'type="date"')) + '</div>';
      case 'agregar_nota':
        return campo('Texto', area(n('texto'), a.texto, 'rows="2"'));
      case 'agregar_compra':
        return campo('Proyecto', selector(n('proyectoId'), opcionesProyectos(true, 'Elegir proyecto'), a.proyectoId)) +
          campo('Qué', input(n('descripcion'), a.descripcion)) +
          '<div class="fila-campos">' + campo('Cantidad', input(n('cantidad'), a.cantidad, 'inputmode="decimal"')) + campo('Unidad', input(n('unidad'), a.unidad)) + '</div>';
      case 'crear_cita':
        return campo('Título', input(n('titulo'), a.titulo)) +
          '<div class="fila-campos">' + campo('Inicio', input(n('inicio'), a.inicio, 'type="datetime-local"')) + campo('Fin', input(n('fin'), a.fin, 'type="datetime-local"')) + '</div>' +
          campo('Lugar', input(n('lugar'), a.lugar)) +
          campo('Proyecto', selector(n('proyectoId'), opcionesProyectos(true, 'Sin proyecto'), a.proyectoId));
      case 'excepcion_dia':
        return campo('Fecha', input(n('fecha'), a.fecha, 'type="date"')) +
          chips(n('trabaja'), [['true', 'Se trabaja'], ['false', 'No se trabaja']], String(!!a.trabaja), 'radio') +
          campo('Proyecto', selector(n('proyectoId'), opcionesProyectos(true, 'Todos los proyectos'), a.proyectoId));
      default:
        return '';
    }
  }

  function mostrarPropuesta(b) {
    S.propuesta = b;
    var p = b.propuesta || { acciones: [], dudas: [] };
    var h = [];
    if (p.transcripcion) h.push('<div class="entendi">«' + esc(p.transcripcion) + '»</div>');
    if (p.dudas && p.dudas.length) h.push('<div class="dudas">' + p.dudas.map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('') + '</div>');
    h.push('<form data-form="propuesta">');
    if (!p.acciones.length) h.push(vacio('La IA no encontró acciones. Descarta y vuelve a intentarlo con más detalle.'));
    p.acciones.forEach(function (a, i) {
      h.push('<div class="accion ' + (a._ok ? 'ok' : 'mala') + '">' +
        '<label class="accion-cabecera"><input type="checkbox" name="sel" value="' + i + '" data-lista="1"' + (a._ok ? ' checked' : '') + '>' +
        '<span><strong>' + esc(NOMBRE_ACCION[a.tipo] || a.tipo) + '</strong>' + esc(a._texto || '') + '</span></label>' +
        (a._problema ? '<p class="problema">' + esc(a._problema) + '. Corrígelo abajo o déjalo sin marcar.</p>' : '') +
        camposAccion(a, i) + '</div>');
    });
    h.push('<div class="barra-botones">' +
      (p.acciones.length ? '<button type="submit" class="btn btn-primario">Aplicar marcadas</button>' : '') +
      '<button type="button" class="btn btn-plano" data-a="descartarPropuesta">Descartar</button></div>' +
      '<p class="ayuda">Si cierras sin aplicar, queda guardada en Por confirmar.</p></form>');
    abrirModal('Confirma los cambios', h.join(''));
  }

  FORM.propuesta = function (f, d, boton) {
    var b = S.propuesta;
    var sel = d.sel || [];
    if (!sel.length) { aviso('Marca al menos un cambio o descarta la propuesta.', { tipo: 'error' }); return; }
    var acciones = sel.map(function (i) {
      var a = {};
      Object.keys(b.propuesta.acciones[i]).forEach(function (k) { if (k.charAt(0) !== '_') a[k] = b.propuesta.acciones[i][k]; });
      var prefijo = 'a' + i + '_';
      Object.keys(d).forEach(function (k) {
        if (k.indexOf(prefijo) !== 0) return;
        var c = k.slice(prefijo.length);
        a[c] = c === 'trabaja' ? d[k] === 'true' : d[k];
      });
      if (a.proyectoId === '') a.proyectoId = null;
      return a;
    });
    hacer(boton, llamar('apiIaAplicar', b.id, acciones)).then(function (r) {
      S.d = r.bootstrap;
      S.detalles = {};
      cerrarModal();
      render(true);
      var texto = r.hechas.length + (r.hechas.length === 1 ? ' cambio aplicado' : ' cambios aplicados');
      if (r.errores.length) {
        abrirModal('No se aplicó todo', '<p>' + esc(texto) + '. Estos no se pudieron aplicar:</p><div class="dudas">' +
          r.errores.map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('') + '</div>' +
          '<div class="barra-botones"><button class="btn" data-a="cerrar">Entendido</button></div>');
      } else if (S.d.ultimoLoteId === b.id) {
        aviso(texto, { accion: { texto: 'Deshacer', fn: function () { deshacer(b.id); } } });
      } else {
        aviso(texto);
      }
    }).catch(ignorar);
  };

  /** Tareas puntuales asignadas a un subcontratista (cotización elegida), historial completo. */
  function tareasDeSubcontratista(subId) {
    var lista = S.tareasSub[subId];
    if (!lista && S.cargandoTareasSub !== subId) {
      S.cargandoTareasSub = subId;
      llamar('apiTareasDeSubcontratista', subId).then(function (r) {
        S.tareasSub[subId] = r;
        S.cargandoTareasSub = null;
        if (S.subAbierto === subId && !$('#modal').hidden) verSubcontratista(subId);
      }).catch(function (e) {
        S.cargandoTareasSub = null;
        aviso(e.message, { tipo: 'error' });
      });
    }
    return lista;
  }

  function verSubcontratista(id) {
    var s = porId(S.d.subcontratistas, id);
    if (!s) { aviso('Ya no está disponible.', { tipo: 'error' }); return; }
    S.subAbierto = id;
    var h = [formSubcontratista(s)];
    if (s.telefono || s.correo) {
      h.push('<div class="barra-botones">' +
        (s.telefono ? '<a class="btn btn-chico" target="_blank" rel="noopener" href="https://wa.me/' + esc(telefonoWhatsApp(s.telefono)) + '">WhatsApp</a>' : '') +
        (s.correo ? '<a class="btn btn-chico" href="mailto:' + esc(s.correo) + '">Correo</a>' : '') + '</div>');
    }
    h.push(seccion('Proyectos'));
    var links = S.d.subcontratistasProyectos.filter(function (r) { return r.subcontratistaId === id; });
    if (links.length) {
      h.push('<div class="lista">' + links.map(function (r) {
        var p = proyecto(r.proyectoId);
        var trato = textoTrato(r);
        return '<div class="item"><span class="principal"><span class="nombre">' + esc(p ? p.nombre : 'Proyecto eliminado') + '</span>' +
          (r.nota ? '<span class="detalle">' + esc(r.nota) + '</span>' : '') +
          (trato ? '<span class="detalle">' + esc(trato) + '</span>' : '') + '</span>' +
          '<span class="acciones"><button class="btn btn-chico btn-plano" data-a="editarTratoSub" data-id="' + r.id + '" aria-label="Editar trato">Trato</button>' +
          '<button class="btn btn-chico btn-plano" data-a="quitarSubcontratistaProyecto" data-id="' + r.id + '" aria-label="Quitar">✕</button></span></div>';
      }).join('') + '</div>');
    } else {
      h.push(vacio('Aún no se ha asignado a ningún proyecto.'));
    }
    if (S.d.proyectos.length) {
      h.push('<form data-form="asignarSubProyecto"><input type="hidden" name="subcontratistaId" value="' + id + '">' +
        campo('Asignar a un proyecto', selector('proyectoId', opcionesProyectos(false), '')) +
        campo('Cómo resultó (opcional)', input('nota', '', 'maxlength="500" placeholder="Buena relación, cumplió los plazos…"')) +
        '<button type="submit" class="btn">Asignar</button></form>');
    }

    h.push(seccion('Tareas asignadas'));
    var tareasAsignadas = tareasDeSubcontratista(id);
    if (!tareasAsignadas) {
      h.push(vacio('Cargando…'));
    } else if (tareasAsignadas.length) {
      h.push('<div class="lista">' + tareasAsignadas.map(function (x) {
        var pr = proyecto(x.tarea.proyectoId);
        return '<div class="item"><span class="principal"><span class="nombre">' + esc(x.tarea.titulo) +
          (x.cotizacion.pagado ? ' <span class="chip chip-verde">Pago finalizado</span>' : '') + '</span>' +
          '<span class="detalle">' + esc([pr ? pr.nombre : '', textoTratoCotizacion(x.cotizacion)].filter(Boolean).join(' — ')) + '</span></span>' +
          '<button class="btn btn-chico" data-a="verTarea" data-id="' + x.tarea.id + '">Ver tarea</button></div>';
      }).join('') + '</div>');
    } else {
      h.push(vacio('Aún no se le ha asignado ninguna tarea puntual. Elige su cotización en una tarea para asignarla como responsable.'));
    }

    h.push(seccion('Pagos'));
    var pagos = S.d.pagosSubcontratistas.filter(function (r) { return r.subcontratistaId === id; })
      .sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; });
    if (pagos.length) {
      var totalPagado = pagos.reduce(function (sum, r) { return sum + (Number(r.monto) || 0); }, 0);
      h.push('<div class="lista">' + pagos.map(function (r) {
        var pr = r.proyectoId ? proyecto(r.proyectoId) : null;
        var t = r.tareaId ? porId(S.d.tareas, r.tareaId) : null;
        return '<div class="item"><span class="principal"><span class="nombre">' + esc(pesos(r.monto)) + '</span>' +
          '<span class="detalle">' + esc([fechaLarga(r.fecha), t ? t.titulo : (pr ? pr.nombre : ''), r.nota].filter(Boolean).join(', ')) + '</span></span>' +
          '<button class="btn btn-chico btn-plano" data-a="eliminarPagoSubcontratista" data-id="' + r.id + '" aria-label="Eliminar">✕</button></div>';
      }).join('') + '</div>');
      h.push('<p class="ayuda">Total pagado: ' + esc(pesos(totalPagado)) + '</p>');
    } else {
      h.push(vacio('Sin pagos registrados.'));
    }
    h.push('<form data-form="registrarPago"><input type="hidden" name="subcontratistaId" value="' + id + '">' +
      '<input type="hidden" name="_origenDetalle" value="1">' +
      campo('Proyecto (opcional)', selector('proyectoId', opcionesProyectos(true, 'Sin proyecto'), '')) +
      '<div class="fila-campos">' + campo('Monto', inputMonto('monto', '', 'inputmode="numeric" required')) +
      campo('Fecha', input('fecha', S.d.hoy, 'type="date"')) + '</div>' +
      campo('Nota (opcional)', input('nota', '', 'maxlength="300" placeholder="Adelanto, pago parcial…"')) +
      '<button type="submit" class="btn btn-primario">Registrar pago</button></form>');
    abrirModal('Subcontratista', h.join(''));
  }

  /**
   * Asignar un subcontratista directo a una tarea del proyecto, desde la pestaña Subcontratos
   * (pedido de Kevin: no obligarlo a entrar primero a la tarea para poder asignarlo ahí). Reusa
   * el mismo formulario/endpoint de cotizaciones (data-form="cotizacion"), con "elegida" fijo en
   * true: es un atajo para dejarlo de una vez como responsable, no para comparar cotizaciones.
   * Solo ofrece tareas abiertas (no tiene sentido asignar una ya resuelta o cancelada).
   */
  ACC.asignarSubTarea = function (el) {
    var subId = el.dataset.sub, pid = el.dataset.proyecto;
    var s = porId(S.d.subcontratistas, subId);
    var tareas = S.d.tareas.filter(function (t) { return t.proyectoId === pid && t.estado !== 'resuelta' && t.estado !== 'cancelada'; });
    if (!tareas.length) { aviso('No hay tareas abiertas en este proyecto para asignarle.', { tipo: 'error' }); return; }
    abrirModal('Asignar a una tarea' + (s ? ': ' + s.nombre : ''),
      '<form data-form="cotizacion"><input type="hidden" name="subcontratistaId" value="' + subId + '">' +
      '<input type="hidden" name="elegida" value="true">' +
      campo('Tarea', selector('tareaId', tareas.map(function (t) { return [t.id, t.titulo]; }), '')) +
      '<div class="fila-campos">' + campo('Cuánto cobraría', inputMonto('monto', '', 'inputmode="numeric" required')) +
      campo('Nota (opcional)', input('nota', '', 'maxlength="200"')) + '</div>' +
      // Ronda 11 (antes solo estaba en formCotizacion): este formulario es una copia aparte, no
      // reusa formCotizacion (necesita el selector de Tarea, que formCotizacion no tiene, porque
      // ahí la tarea ya viene fija), así que el checkbox "no cobra aparte" se agrega también acá
      // a mano para que el mismo atajo funcione asignando otra tarea directo desde Subcontratos.
      '<label class="interruptor"><input type="checkbox" name="sinCobro" data-cambio="sinCobroCotizacion"> No cobra aparte por esta tarea (ya cobra en otra) — deja el monto en $0</label>' +
      '<div class="campo"><span>Ese monto</span>' + chips('incluyeIva', [['true', 'Incluye IVA'], ['false', 'Es neto (falta sumarle IVA)']], 'true', 'radio') + '</div>' +
      botones('Asignar') + '</form>');
  };

  ACC.quitarSubcontratistaProyecto = function (el) {
    var link = porId(S.d.subcontratistasProyectos, el.dataset.id);
    var msg = '¿Quitar a este subcontratista del proyecto?';
    if (link) {
      var pagos = S.d.pagosSubcontratistas.filter(function (r) {
        return r.subcontratistaId === link.subcontratistaId && r.proyectoId === link.proyectoId && !r.tareaId;
      });
      if (pagos.length) {
        var total = pagos.reduce(function (s, r) { return s + (Number(r.monto) || 0); }, 0);
        msg = '¿Quitar a este subcontratista del proyecto? También se eliminarán ' + pagos.length + ' pago' + (pagos.length === 1 ? '' : 's') +
          ' registrado' + (pagos.length === 1 ? '' : 's') + ' por ' + pesos(total) + ' (úsalo solo si te equivocaste de subcontratista).';
      }
    }
    if (!confirmar(msg)) return;
    hacer(el, llamar('apiQuitarSubcontratistaProyecto', el.dataset.id)).then(function (r) {
      quitar(S.d.subcontratistasProyectos, el.dataset.id);
      (r.pagosEliminados || []).forEach(function (pid) { quitar(S.d.pagosSubcontratistas, pid); });
      if (link) delete S.detalles[link.proyectoId];
      if (el.closest('#modal') && link) verSubcontratista(link.subcontratistaId); else render(true);
    }).catch(ignorar);
  };

  // ---------- Trato (monto acordado + IVA) con un subcontratista en un proyecto ----------

  ACC.editarTratoSub = function (el) {
    var link = porId(S.d.subcontratistasProyectos, el.dataset.id);
    if (!link) return;
    var s = porId(S.d.subcontratistas, link.subcontratistaId);
    var pr = proyecto(link.proyectoId);
    var incluyeIva = link.incluyeIva === false ? 'false' : 'true';
    abrirModal('Trato' + (s ? ': ' + s.nombre : ''), (pr ? '<p class="ayuda" style="margin-top:0">Proyecto: ' + esc(pr.nombre) + '</p>' : '') +
      '<form data-form="trato"><input type="hidden" name="subcontratistaId" value="' + link.subcontratistaId + '">' +
      '<input type="hidden" name="proyectoId" value="' + link.proyectoId + '">' +
      '<input type="hidden" name="nota" value="' + esc(link.nota || '') + '">' +
      campo('Monto acordado (el total que te dijo)', inputMonto('montoTrato', link.montoTrato, 'inputmode="numeric" placeholder="Déjalo vacío si aún no hay trato"')) +
      '<div class="campo"><span>Ese monto</span>' + chips('incluyeIva', [['true', 'Incluye IVA'], ['false', 'Es neto (falta sumarle IVA)']], incluyeIva, 'radio') + '</div>' +
      '<p class="ayuda">El IVA en Chile es ' + (S.d.config.ivaTasa || 19) + '%. Con el trato guardado, cada pago que registres va mostrando cuánto llevas pagado y cuánto saldo queda.</p>' +
      botones('Guardar trato') + '</form>');
  };

  FORM.trato = function (f, d, boton) {

  <script>
  /**
   * Voz — tres caminos, porque no todos están disponibles en todos lados:
   * 1) Dictado del teclado de iOS en el cuadro de texto (funciona siempre, incluso embebido en
   *    Apps Script).
   * 2) Grabar acá mismo con el micrófono (getUserMedia+MediaRecorder, Ronda 5): NO funciona
   *    embebido en Apps Script (Google sirve /exec dentro de un iframe sin permiso de
   *    micrófono, fuera de nuestro control) — sí funciona en la PWA instalada o abierta
   *    directo en Safari. Se detecta solo y, si no se puede, avisa y sugiere las otras opciones
   *    en vez de fallar en silencio.
   * 3) Subir una nota de voz (m4a) desde Archivos: se convierte a WAV mono 16 kHz y la IA
   *    transcribe + interpreta. Funciona en todos lados.
   * 4) Fuera de la app: Atajo de iOS "Anotar obra" (ver docs/INSTALACION.md) — sirve para
   *    manos libres manejando, sin ni siquiera abrir la app.
   */

  var grabadorActual = null; // { recorder, chunks, inicio, tope, intervalo } mientras se graba

  ACC.hablar = function () {
    if (!S.d) return;
    var sinIa = !S.d.config.iaDisponible;
    abrirModal('Anotar con IA', '<form data-form="hablar">' +
      '<label class="campo"><span>Escribe o toca el micrófono del teclado y habla</span>' +
      '<textarea id="texto-ia" name="texto" rows="5" placeholder="Ej: mañana Pedro y Juan pintan la fachada de Ñuñoa, faltan 2 galones de látex"></textarea></label>' +
      '<div class="barra-botones"><button type="submit" class="btn btn-primario"' + (sinIa ? ' disabled' : '') + '>Interpretar</button>' +
      '<button type="button" class="btn" data-a="grabar"' + (sinIa ? ' disabled' : '') + '>🎙️ Grabar</button>' +
      '<button type="button" class="btn" data-a="subirAudio"' + (sinIa ? ' disabled' : '') + '>Subir nota de voz</button></div>' +
      (sinIa ? '<p class="ayuda">La IA no está configurada. Puedes crear tareas y notas a mano.</p>'
        : '<p class="ayuda">Nada se guarda hasta que lo confirmes. También puedes usar el Atajo "Anotar obra" desde Siri sin abrir la app.</p>') +
      '</form>');
    // Se retrasa un frame: deja que el modal termine de ubicarse (ajustarViewport) antes
    // de enfocar, para que Safari no calcule el zoom con el layout todavía sin acomodar.
    requestAnimationFrame(function () {
      var t = $('#texto-ia');
      if (t) t.focus();
    });
  };

  FORM.hablar = function (f, d, boton) {
    var texto = (d.texto || '').trim();
    if (!texto) { aviso('Escribe o dicta algo primero.', { tipo: 'error' }); return; }
    hacer(boton, llamar('apiIaInterpretarTexto', texto)).then(recibirBorrador).catch(ignorar);
  };

  ACC.subirAudio = function (el) {
    elegirArchivos('audio/*,.m4a,.mp3,.wav,.aac', false).then(function (archivos) {
      var archivo = archivos[0];
      el.disabled = true;
      el.classList.add('cargando');
      aviso('Preparando audio…', { ms: 60000 });
      return audioAWavBase64(archivo).then(function (b64) {
        var mb = b64.length * 3 / 4 / 1024 / 1024;
        if (mb > S.d.config.audioMaxMb) throw new Error('El audio es muy largo. Prueba con uno de menos de 3 minutos.');
        aviso('Interpretando audio…', { ms: 90000 });
        return llamar('apiIaInterpretarAudio', b64);
      }).then(function (b) {
        $('#aviso').hidden = true;
        recibirBorrador(b);
      }).then(function () {
        el.disabled = false;
        el.classList.remove('cargando');
      }, function (e) {
        el.disabled = false;
        el.classList.remove('cargando');
        throw e;
      });
    }).catch(function (e) { aviso(e.message, { tipo: 'error' }); });
  };

  /** Botones hermanos (Interpretar / Subir) que se apagan mientras se graba, para no pisarse. */
  function botonesHermanos_(el) {
    var form = el.closest('form');
    if (!form) return [];
    return [].slice.call(form.querySelectorAll('button')).filter(function (b) { return b !== el; });
  }

  ACC.grabar = function (el) {
    if (grabadorActual) { detenerGrabacion_(el); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
      aviso('Este navegador no puede grabar acá. Prueba desde la app instalada en la pantalla de inicio, o usa el dictado del teclado.', { tipo: 'error' });
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var mime = ['audio/mp4', 'audio/webm'].filter(function (m) { return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m); })[0];
      var recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      var chunks = [];
      recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.addEventListener('stop', function () { stream.getTracks().forEach(function (t) { t.stop(); }); });
      recorder.start();
      grabadorActual = { recorder: recorder, chunks: chunks, inicio: Date.now() };
      botonesHermanos_(el).forEach(function (b) { b.disabled = true; });
      el.classList.add('grabando');
      el.textContent = '⏹ Detener (0:00)';
      grabadorActual.intervalo = setInterval(function () { actualizarCronometro_(el); }, 1000);
      // Tope de seguridad: mismo límite que audioAWavBase64 (10 min de audio).
      grabadorActual.tope = setTimeout(function () { detenerGrabacion_(el); }, 9.5 * 60 * 1000);
    }).catch(function (e) {
      aviso('No se pudo activar el micrófono acá (' + (e.message || e.name || 'permiso denegado') +
        '). Prueba desde la app instalada en la pantalla de inicio, o usa el dictado del teclado.', { tipo: 'error' });
    });
  };

  function actualizarCronometro_(el) {
    if (!grabadorActual) return;
    var s = Math.floor((Date.now() - grabadorActual.inicio) / 1000);
    var mm = Math.floor(s / 60), ss = s % 60;
    el.textContent = '⏹ Detener (' + mm + ':' + (ss < 10 ? '0' : '') + ss + ')';
  }

  function detenerGrabacion_(el) {
    var g = grabadorActual;
    if (!g) return;
    grabadorActual = null;
    clearTimeout(g.tope);
    clearInterval(g.intervalo);
    el.classList.remove('grabando');
    el.disabled = true;
    el.textContent = 'Procesando…';
    new Promise(function (resolver) { g.recorder.addEventListener('stop', resolver, { once: true }); g.recorder.stop(); })
      .then(function () {
        var blob = new Blob(g.chunks, { type: g.recorder.mimeType || 'audio/webm' });
        if (!blob.size) throw new Error('No se grabó nada. Intenta de nuevo.');
        aviso('Preparando audio…', { ms: 60000 });
        return audioAWavBase64(blob).then(function (b64) {
          var mb = b64.length * 3 / 4 / 1024 / 1024;
          if (mb > S.d.config.audioMaxMb) throw new Error('La grabación es muy larga. Prueba con algo más corto.');
          aviso('Interpretando audio…', { ms: 90000 });
          return llamar('apiIaInterpretarAudio', b64);
        });
      }).then(function (b) {
        $('#aviso').hidden = true;
        recibirBorrador(b);
      }).catch(function (e) {
        aviso(e.message, { tipo: 'error' });
      }).then(function () {
        el.disabled = false;
        el.textContent = '🎙️ Grabar';
        botonesHermanos_(el).forEach(function (b) { b.disabled = false; });
      });
  }

  /** Decodifica cualquier audio que Safari entienda (m4a/aac/mp3/wav) → WAV PCM 16 bit mono 16 kHz en base64. */
  function audioAWavBase64(archivo) {
    var Contexto = window.AudioContext || window.webkitAudioContext;
    var Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!Contexto || !Offline) return Promise.reject(new Error('Este navegador no puede procesar audio.'));
    return archivo.arrayBuffer().then(function (buffer) {
      var ctx = new Contexto();
      return new Promise(function (ok, falla) {
        ctx.decodeAudioData(buffer, ok, function () { falla(new Error('No se pudo leer el audio. Usa una nota de voz en m4a.')); });
      }).then(function (audio) {
        if (ctx.close) ctx.close();
        if (audio.duration > 600) throw new Error('El audio dura más de 10 minutos.');
        var tasa = 16000;
        var off = new Offline(1, Math.max(1, Math.ceil(audio.duration * tasa)), tasa);
        var fuente = off.createBufferSource();
        fuente.buffer = audio;
        fuente.connect(off.destination);
        fuente.start(0);
        return off.startRendering();
      });
    }).then(function (render) {
      return bytesABase64(codificarWav(render.getChannelData(0), 16000));
    });
  }

  function codificarWav(muestras, tasa) {
    var buffer = new ArrayBuffer(44 + muestras.length * 2);
    var v = new DataView(buffer);
    function texto(pos, s) { for (var i = 0; i < s.length; i++) v.setUint8(pos + i, s.charCodeAt(i)); }
    texto(0, 'RIFF');
    v.setUint32(4, 36 + muestras.length * 2, true);
    texto(8, 'WAVE');
    texto(12, 'fmt ');
    v.setUint32(16, 16, true);
    v.setUint16(20, 1, true);        // PCM
    v.setUint16(22, 1, true);        // mono
    v.setUint32(24, tasa, true);
    v.setUint32(28, tasa * 2, true); // bytes por segundo
    v.setUint16(32, 2, true);
    v.setUint16(34, 16, true);
    texto(36, 'data');
    v.setUint32(40, muestras.length * 2, true);
    var pos = 44;
    for (var i = 0; i < muestras.length; i++, pos += 2) {
      var s = Math.max(-1, Math.min(1, muestras[i]));
      v.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return new Uint8Array(buffer);
  }
</script>

  <script>
  /**
   * Abre el selector de archivos. Debe llamarse directo dentro de un toque (iOS lo exige).
   * @return {Promise<File[]>}
   */
  function elegirArchivos(accept, multiple) {
    return new Promise(function (ok) {
      var entrada = document.createElement('input');
      entrada.type = 'file';
      entrada.accept = accept;
      entrada.multiple = !!multiple;
      entrada.style.position = 'fixed';
      entrada.style.left = '-1000px';
      document.body.appendChild(entrada);
      entrada.addEventListener('change', function () {
        var archivos = Array.prototype.slice.call(entrada.files || []);
        entrada.remove();
        if (archivos.length) ok(archivos);
      });
      entrada.click();
    });
  }

  function leerBase64(archivo) {
    return new Promise(function (ok, falla) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).split(',')[1] || ''); };
      r.onerror = function () { falla(new Error('No se pudo leer el archivo.')); };
      r.readAsDataURL(archivo);
    });
  }

  function bytesABase64(bytes) {
    var partes = [];
    var paso = 0x8000;
    for (var i = 0; i < bytes.length; i += paso) {
      partes.push(String.fromCharCode.apply(null, bytes.subarray(i, i + paso)));
    }
    return btoa(partes.join(''));
  }

  /**
   * Reduce una foto a `lado` px en su lado mayor y la guarda como JPEG (convierte HEIC).
   * @return {Promise<{nombre, mime, base64}>}
   */
  function comprimirImagen(archivo, lado, calidad) {
    lado = lado || 1600;
    calidad = calidad || 0.8;
    return new Promise(function (ok, falla) {
      var url = URL.createObjectURL(archivo);
      var img = new Image();
      img.onload = function () {
        var escala = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
        var w = Math.max(1, Math.round(img.naturalWidth * escala));
        var h = Math.max(1, Math.round(img.naturalHeight * escala));
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        var dataUrl = canvas.toDataURL('image/jpeg', calidad);
        var nombre = String(archivo.name || 'foto').replace(/\.[a-z0-9]+$/i, '') + '.jpg';
        ok({ nombre: nombre, mime: 'image/jpeg', base64: dataUrl.split(',')[1] });
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        falla(new Error('No se pudo abrir la imagen.'));
      };
      img.src = url;
    });
  }
</script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js').catch(function () {});
      });
    }
    if (!CLAVE) {
      // Ronda 6c, parte 4 (v0.12.5) — bug real y más profundo que los de las partes 1-3, encontrado
      // por Kevin viendo el propio diálogo "Agregar a inicio" de iOS: apenas se linkea manifest.json
      // (el <link rel="manifest"> del <head>, no el marcador de estilos), iOS deja de usar la URL
      // actual de la pestaña para el acceso directo que va a crear — usa el "start_url" del manifest
      // ("./index.html", fijo, sin clave) — así que NINGÚN truco en la URL (ni "?k=", ni "#k=", ni
      // limpiarla o no) puede llegar nunca al ícono instalado: iOS ni siquiera mira esa URL para armar
      // el acceso directo una vez que hay manifest de por medio. Es un problema distinto del de
      // localStorage (parte 1): ese explicaba por qué la clave no viajaba sola; este explica por qué
      // tampoco viaja la URL en sí. Fix: en vez de seguir peleando con la URL, se pide la clave acá
      // mismo, una sola vez, dentro de esta misma pestaña/ícono — así se guarda directo en el
      // `localStorage` de ESTE contexto (el de la pestaña de Safari, o el del ícono si ya se abrió
      // desde ahí), sin depender de que la URL o el manifest la hayan traído.
      document.getElementById('vista').innerHTML =
        '<div class="vacio">' +
        '<p>Para entrar la primera vez, escribe la clave de acceso (la que muestra <strong>Obras → Ver enlace vigente</strong>, "Clave para el Atajo de iOS"):</p>' +
        '<form id="formClaveManual">' +
        '<label class="campo"><span>Clave de acceso</span>' +
        '<input id="inputClaveManual" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Pega la clave aquí"></label>' +
        '<button type="submit" class="btn btn-primario">Entrar</button>' +
        '</form></div>';
      document.getElementById('formClaveManual').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var valor = document.getElementById('inputClaveManual').value.trim();
        if (!valor) return;
        try { localStorage.setItem('clave', valor); } catch (e) {}
        location.reload();
      });
    } else {
      iniciar();
    }
  </script>
