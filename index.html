<!DOCTYPE html>
<!--
  Plantilla del sitio estático (Ronda 5, PWA vía GitHub Pages). scripts/construir-web.js la
  convierte en web/index.html, reemplazando cada marcador doble-llave (p.ej. ESTILOS) por el
  contenido de su archivo compartido en src/ui/ (los mismos que usa la página embebida en
  Apps Script, src/ui/Index.html
  — no hay una segunda copia de la interfaz). No pasa por HtmlService, así que no hay `<?!= ?>`:
  lo que necesitaba el template de Apps Script (la clave, la URL del API) se resuelve acá con
  localStorage + config.js, ver los scripts al final del <body>.
-->
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#1f4e8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Obras">
  <title>Obras</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <style>
  /* Paleta: concreto claro, tinta, azul plano, amarillo seguridad (solo el micrófono), rojo señalética, verde ok */
  :root {
    --fondo: #eef0f0;
    --superficie: #ffffff;
    --superficie-2: #f6f7f7;
    --tinta: #1c2326;
    --tinta-2: #56646a;
    --linea: #d5dadb;
    --azul: #1f4e8c;
    --azul-suave: #e3ebf5;
    --amarillo: #f2b705;
    --amarillo-suave: #fff4cc;
    --rojo: #c8322b;
    --rojo-suave: #fbe7e5;
    --verde: #2f7d4f;
    --verde-suave: #e2f1e8;
    --c: var(--azul);
    --tabs: 64px;
    --seguro-abajo: env(safe-area-inset-bottom, 0px);
    --seguro-arriba: env(safe-area-inset-top, 0px);
    --fuente: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --fuente-titulo: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--tinta);
    font: 16px/1.4 var(--fuente);
    font-variant-numeric: tabular-nums;
    min-height: 100dvh;
    /* Bug real, encontrado por Kevin viendo la PWA ya instalada (standalone) en su iPhone: el
       encabezado ("Hoy", "Proyectos", etc.) aparecía cortado bajo la barra de estado. La página pide
       "apple-mobile-web-app-status-bar-style: black-translucent" (para que la barra de estado no deje
       una franja sólida encima), y eso hace que el contenido se dibuje POR DEBAJO del notch/reloj a
       menos que se le sume manualmente el alto real de la barra de estado — exactamente lo que ya se
       hacía abajo (--seguro-abajo) para no tapar el contenido con la barra de pestañas, pero nunca
       arriba. Solo se nota con el ícono instalado (standalone): en Safari normal, la barra de
       direcciones ya empuja el contenido hacia abajo, por eso no se veía en las pruebas anteriores. */
    padding-top: var(--seguro-arriba);
    padding-bottom: calc(var(--tabs) + var(--seguro-abajo) + 24px);
  }
  body.con-modal { overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--amarillo); outline-offset: 2px; }
  [hidden] { display: none !important; }

  main { max-width: 680px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Encabezados ---------- */
  .cabecera { padding: 22px 0 10px; display: flex; align-items: flex-end; gap: 12px; }
  .cabecera h1 {
    font: 700 30px/1.1 var(--fuente-titulo);
    letter-spacing: -0.01em;
    margin: 0;
    flex: 1;
  }
  .cabecera .sub { display: block; font: 500 15px/1.3 var(--fuente); color: var(--tinta-2); margin-top: 4px; letter-spacing: 0; }
  .volver {
    border: 0; background: none; color: var(--azul); font-weight: 600; padding: 16px 0 0; display: block;
  }
  h2.seccion {
    font: 700 19px/1.2 var(--fuente-titulo);
    margin: 26px 0 8px;
    display: flex; align-items: baseline; gap: 8px;
  }
  h2.seccion .cuenta { font: 600 15px var(--fuente); color: var(--tinta-2); }
  h2.seccion.alerta { color: var(--rojo); }

  /* ---------- Franjas de aviso en Hoy ---------- */
  .franja {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: left; border: 0; border-radius: 12px;
    padding: 14px 16px; margin: 8px 0; font-weight: 600;
  }
  .franja-ia { background: var(--tinta); color: #fff; }
  .franja-ia::after { content: "Revisar"; color: var(--amarillo); font-weight: 700; }
  .franja-resumen { background: var(--amarillo-suave); border-left: 6px solid var(--amarillo); border-radius: 4px 12px 12px 4px; }

  /* ---------- Grupos por proyecto ---------- */
  .grupo {
    background: var(--superficie);
    border-radius: 4px 14px 14px 4px;
    border-left: 5px solid var(--c);
    margin: 10px 0;
    overflow: hidden;
  }
  .grupo-titulo {
    display: flex; justify-content: space-between; align-items: center;
    font: 700 15px/1.2 var(--fuente); color: var(--c);
    padding: 12px 14px 4px; margin: 0;
  }
  .grupo-titulo button { border: 0; background: none; color: var(--c); font-weight: 700; padding: 0; text-align: left; }

  /* ---------- Filas de tarea ---------- */
  .tarea { display: flex; align-items: stretch; border-top: 1px solid var(--linea); }
  .grupo-titulo + .tarea { border-top: 0; }
  .check {
    flex: 0 0 56px; border: 0; background: none; display: grid; place-items: center; padding: 0;
  }
  .check span {
    width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--tinta-2);
    display: grid; place-items: center; color: transparent; font-weight: 800; font-size: 15px;
  }
  .tarea.resuelta .check span { background: var(--verde); border-color: var(--verde); color: #fff; }
  .tarea.resuelta .t-titulo { text-decoration: line-through; color: var(--tinta-2); }
  .cuerpo {
    flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 12px 14px 12px 0;
  }
  .t-titulo { display: block; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .t-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; font-size: 14px; color: var(--tinta-2); }
  .t-meta .vence { color: var(--rojo); font-weight: 600; }
  .t-meta .sin { color: var(--rojo); }
  .prioridad-alta .t-titulo::before { content: "!"; color: var(--rojo); font-weight: 800; margin-right: 6px; }

  /* ---------- Listas genéricas ---------- */
  .lista { background: var(--superficie); border-radius: 14px; overflow: hidden; margin: 10px 0; }
  .item {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; width: 100%;
    padding: 14px 16px; border: 0; border-top: 1px solid var(--linea);
    background: none; text-align: left;
  }
  .item:first-child { border-top: 0; }
  .item .principal { flex: 1 1 170px; min-width: 0; }
  .item .nombre { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .item .detalle { display: block; font-size: 14px; color: var(--tinta-2); margin-top: 2px; }
  .item .lado { font-weight: 600; color: var(--tinta-2); white-space: nowrap; }
  .item .acciones { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .item.proyecto { border-left: 5px solid var(--c); }
  /* Fila "hija" de otra (ej: cada tarea de un subcontratista sin trato de proyecto, Ronda 8) — mismo
     look que .item pero con sangría y fondo distinto, para que se lea como parte de la de arriba. */
  .item.item-anidado { padding-left: 32px; background: var(--superficie-2); }

  .vacio { color: var(--tinta-2); padding: 18px 4px; margin: 0; }
  .vacio strong { color: var(--tinta); }

  /* ---------- Botones ---------- */
  .btn {
    border: 1.5px solid var(--linea); background: var(--superficie); border-radius: 10px;
    padding: 10px 14px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; color: var(--tinta);
  }
  .btn-chico { min-height: 36px; padding: 6px 10px; font-size: 14px; border-radius: 8px; }
  .btn-primario { background: var(--azul); border-color: var(--azul); color: #fff; }
  .btn-ok { background: var(--verde); border-color: var(--verde); color: #fff; }
  .btn-peligro { color: var(--rojo); border-color: var(--rojo-suave); }
  .btn-plano { border-color: transparent; background: none; color: var(--azul); }
  .btn[disabled] { opacity: .55; }
  .btn.cargando { position: relative; color: transparent !important; }
  .btn.cargando::after {
    content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
    border: 2.5px solid currentColor; border-color: var(--tinta-2) transparent var(--tinta-2) transparent;
    animation: girar .8s linear infinite;
  }
  .btn-primario.cargando::after, .btn-ok.cargando::after { border-color: #fff transparent #fff transparent; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .btn.grabando { background: var(--rojo); border-color: var(--rojo); color: #fff; animation: latir 1.2s ease-in-out infinite; }
  @keyframes latir { 50% { opacity: .7; } }
  .barra-botones { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .barra-botones .btn { flex: 1 1 auto; }

  /* ---------- Chips y estados ---------- */
  .chip {
    display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 10px;
    font-size: 13px; font-weight: 600; background: var(--superficie-2); color: var(--tinta-2);
  }
  .chip-azul { background: var(--azul-suave); color: var(--azul); }
  .chip-rojo { background: var(--rojo-suave); color: var(--rojo); }
  .chip-verde { background: var(--verde-suave); color: var(--verde); }
  .chip-amarillo { background: var(--amarillo-suave); color: #7a5b00; }

  /* ---------- Resumen del proyecto: avance y gasto real ---------- */
  .resumen-proyecto { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 12px; }
  .resumen-item {
    flex: 1 1 220px; background: var(--superficie); border-radius: 12px; padding: 10px 14px;
  }
  .resumen-etiqueta { display: block; font-size: 12px; font-weight: 700; color: var(--tinta-2); text-transform: none; margin-bottom: 4px; }
  .resumen-valor { font-weight: 700; font-size: 15px; }
  .resumen-chico { font-weight: 500; font-size: 13px; color: var(--tinta-2); }
  .resumen-alerta { color: var(--rojo); }
  .cuenta-vence { display: block; font-size: 14px; color: var(--tinta-2); margin-top: 2px; }
  .cuenta-vence.vencida { color: var(--rojo); font-weight: 600; }
  .barra-avance { height: 8px; border-radius: 4px; background: var(--superficie-2); overflow: hidden; margin-bottom: 6px; }
  .barra-avance-rellena { height: 100%; background: var(--verde); border-radius: 4px; }

  /* ---------- Pestañas del proyecto ---------- */
  .pestanas {
    display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    margin: 6px -16px 4px; padding: 0 16px;
    position: sticky; top: 0; background: var(--fondo); z-index: 5;
  }
  .pestanas::-webkit-scrollbar { display: none; }
  .pestanas button {
    border: 0; background: none; padding: 12px 10px 10px; font-weight: 600; color: var(--tinta-2);
    border-bottom: 3px solid transparent; white-space: nowrap;
  }
  .pestanas button[aria-current="true"] { color: var(--tinta); border-bottom-color: var(--c); }

  .segmentos { display: flex; background: var(--superficie); border-radius: 12px; padding: 4px; margin: 10px 0; }
  .segmentos button { flex: 1 1 auto; border: 0; background: none; border-radius: 9px; padding: 9px 6px; font-weight: 600; font-size: 14px; color: var(--tinta-2); white-space: nowrap; }
  .segmentos .n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--rojo); color: #fff; font-size: 11px; line-height: 18px; margin-left: 2px; }
  .segmentos button[aria-current="true"] { background: var(--tinta); color: #fff; }

  /* ---------- Barra inferior ---------- */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; justify-content: space-around;
    background: var(--superficie); border-top: 1px solid var(--linea);
    padding-bottom: var(--seguro-abajo); height: calc(var(--tabs) + var(--seguro-abajo));
  }
  .tabs button {
    flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; font-size: 12px; font-weight: 600; color: var(--tinta-2); max-width: 120px; position: relative;
  }
  .tabs svg { width: 24px; height: 24px; }
  .tabs button[aria-current="true"] { color: var(--azul); }
  .tabs .globo {
    position: absolute; top: 6px; left: 55%; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px;
    background: var(--rojo); color: #fff; font-size: 11px; line-height: 18px; text-align: center;
  }

  /* ---------- Micrófono: el elemento memorable ---------- */
  .mic {
    position: fixed; right: 18px; bottom: calc(var(--tabs) + var(--seguro-abajo) + 16px); z-index: 21;
    width: 68px; height: 68px; border-radius: 50%;
    background: var(--amarillo); color: var(--tinta);
    border: 3px solid var(--tinta);
    box-shadow: 0 0 0 5px var(--fondo), 0 6px 16px rgba(28, 35, 38, .28);
    display: grid; place-items: center;
  }
  .mic svg { width: 30px; height: 30px; }
  .mic:active { transform: scale(.95); }
  .mic .globo {
    position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px;
    background: var(--rojo); color: #fff; font-size: 11px; line-height: 18px; text-align: center;
    border: 2px solid var(--fondo);
  }

  /* ---------- Hoja modal ---------- */
  .modal {
    position: fixed; left: 0; right: 0; top: 0; height: 100dvh; z-index: 40; background: rgba(28, 35, 38, .45);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .hoja {
    background: var(--fondo); width: 100%; max-width: 680px; max-height: 92%; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 8px 16px calc(24px + var(--seguro-abajo));
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  @media (min-width: 720px) {
    .modal { align-items: center; }
    .hoja { border-radius: 18px; max-height: 86%; }
  }
  .hoja-cabecera {
    display: flex; align-items: center; gap: 8px; position: sticky; top: -8px; background: var(--fondo);
    padding: 12px 0 8px; z-index: 2;
  }
  .hoja-cabecera h2 { flex: 1; margin: 0; font: 700 21px/1.2 var(--fuente-titulo); }
  .hoja-cabecera .cerrar { border: 0; background: var(--superficie); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .hoja { animation: subir .18s ease-out; }
    @keyframes subir { from { transform: translateY(24px); opacity: .6; } }
  }

  /* ---------- Formularios ---------- */
  .campo { display: block; margin: 12px 0; }
  .campo > span { display: block; font-size: 14px; font-weight: 600; color: var(--tinta-2); margin-bottom: 5px; }
  .campo input, .campo select, .campo textarea, .tabla-edit input {
    width: 100%; font-size: 16px; padding: 11px 12px; border-radius: 10px;
    border: 1.5px solid var(--linea); background: var(--superficie); min-height: 46px;
    -webkit-appearance: none; appearance: none;
  }
  .campo select { background-image: linear-gradient(45deg, transparent 50%, var(--tinta-2) 50%), linear-gradient(135deg, var(--tinta-2) 50%, transparent 50%); background-position: calc(100% - 18px) 20px, calc(100% - 13px) 20px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
  .campo textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
  .campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--azul); outline: none; }
  .fila-campos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .campo input[type=date], .campo input[type=datetime-local] { max-width: 100%; min-width: 0; display: block; }
  .fila-campos .campo { margin: 6px 0; }
  .ayuda { font-size: 14px; color: var(--tinta-2); margin: 6px 0 12px; }
  .opciones { display: flex; flex-wrap: wrap; gap: 8px; }
  .opcion { position: relative; }
  .opcion input { position: absolute; opacity: 0; pointer-events: none; }
  .opcion span {
    display: inline-flex; align-items: center; min-height: 40px; padding: 6px 14px; border-radius: 999px;
    border: 1.5px solid var(--linea); background: var(--superficie); font-weight: 600;
  }
  .opcion input:checked + span { background: var(--tinta); border-color: var(--tinta); color: #fff; }
  .opcion input:focus-visible + span { outline: 3px solid var(--amarillo); }
  .interruptor { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-weight: 600; }
  .interruptor input { width: 22px; height: 22px; accent-color: var(--azul); }

  /* ---------- Propuestas de la IA ---------- */
  .entendi { background: var(--superficie); border-radius: 12px; padding: 12px 14px; margin: 6px 0 10px; font-style: italic; }
  .dudas { background: var(--amarillo-suave); border-radius: 12px; padding: 10px 14px; margin: 10px 0; }
  .dudas p { margin: 4px 0; }
  .accion { background: var(--superficie); border-radius: 12px; padding: 4px 14px 10px; margin: 10px 0; border-left: 5px solid var(--linea); }
  .accion.ok { border-left-color: var(--azul); }
  .accion.mala { border-left-color: var(--rojo); }
  .accion-cabecera { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0 2px; }
  .accion-cabecera input { width: 24px; height: 24px; margin-top: 1px; accent-color: var(--azul); flex: 0 0 auto; }
  .accion-cabecera strong { display: block; }
  .accion .problema { color: var(--rojo); font-size: 14px; margin: 2px 0 4px 34px; }
  .accion .campo { margin: 8px 0; }

  /* ---------- Carta Gantt ---------- */
  .gantt { display: flex; align-items: flex-start; background: var(--superficie); border-radius: 14px; overflow: hidden; margin: 10px 0; }
  /* min-width:0 es el fix real (Ronda 8, bug de Kevin: "el texto queda demasiado grande y no veo
     las fechas" en el iPhone). Sin esto, un título de tarea largo (con white-space:nowrap para
     poder truncarlo con "…") hace que el navegador calcule el "tamaño mínimo automático" de esta
     columna a partir del ancho SIN truncar del título más largo, no de los 128px pedidos — y esa
     columna terminaba comiéndose casi todo el ancho de la carta Gantt, dejando las fechas y las
     barras apretadas en una franja angosta. Confirmado renderizando la página de verdad (Playwright)
     antes y después: sin esto la columna de nombres medía ~283px en vez de 128px en un iPhone.
     min-width:0 le devuelve a flexbox el control real del ancho (128px, como pide flex-basis). */
  .gantt-nombres { flex: 0 0 128px; min-width: 0; border-right: 1px solid var(--linea); }
  .gantt-cabecera-esp { height: 40px; border-bottom: 1px solid var(--linea); }
  .gantt-fila-nombre { height: 44px; display: flex; align-items: center; gap: 2px; border-top: 1px solid var(--linea); padding-right: 6px; }
  .gantt-nombres .gantt-fila-nombre:first-child { border-top: 0; }
  .gantt-check { flex: 0 0 24px; border: 0; background: none; padding: 0; display: grid; place-items: center; }
  .gantt-check span {
    width: 19px; height: 19px; border-radius: 50%; border: 2px solid var(--tinta-2);
    display: grid; place-items: center; color: transparent; font-weight: 800; font-size: 10px;
  }
  .gantt-fila-nombre.resuelta .gantt-check span { background: var(--verde); border-color: var(--verde); color: #fff; }
  .gantt-fila-nombre.resuelta .gantt-titulo { text-decoration: line-through; color: var(--tinta-2); }
  .gantt-titulo {
    border: 0; background: none; text-align: left; font: 600 13px/1.25 var(--fuente); padding: 0; flex: 1 1 auto;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: inherit;
  }
  .gantt-scroll { flex: 1; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .gantt-cabecera { display: flex; height: 40px; border-bottom: 1px solid var(--linea); }
  .gantt-dia { flex: 0 0 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--tinta-2); line-height: 1.2; }
  .gantt-dia span { text-transform: uppercase; }
  .gantt-dia b { font-size: 12px; color: var(--tinta); }
  .gantt-dia.finde { background: var(--superficie-2); }
  .gantt-dia.hoy { background: var(--azul-suave); }
  .gantt-dia.hoy b { color: var(--azul); }
  .gantt-pistas {
    position: relative;
    background-image: linear-gradient(var(--linea) 1px, transparent 1px);
    background-position: 0 44px;
  }
  .gantt-hoy { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--rojo); z-index: 1; }
  .gantt-barra {
    position: absolute; height: 32px; border-radius: 8px; border: 0; background: var(--azul-suave); color: var(--azul);

  .bit-cuerpo p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bit-meta { display: block; font-size: 13px; color: var(--tinta-2); margin-top: 2px; }
  .bit-tarea .bit-icono { color: var(--verde); }

  /* ---------- Itemizado ---------- */
  .tabla-wrap { overflow-x: auto; margin: 10px -16px; padding: 0 16px; }

  .tabla-edit .alerta { display: block; color: #7a5b00; font-size: 13px; padding: 2px 4px; }
  .total-linea { display: flex; justify-content: space-between; font-weight: 700; padding: 10px 2px; }

  /* ---------- Archivos ---------- */
  .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin: 10px 0; }
  .miniatura {
    aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--superficie); border: 0; padding: 0;

  .aviso.error button { color: #fff; text-decoration: underline; }

  .pie-info { color: var(--tinta-2); font-size: 13px; margin: 24px 0 8px; }

  <!--
    Clave del enlace: en Apps Script viene del template del servidor (`<?!= JSON.stringify(clave) ?>`).
    Acá no hay servidor de por medio, así que se lee de la URL (**#k=...**, en el fragmento, no en
    "?k=...") la primera vez y se guarda en este teléfono (localStorage).

    Dos bugs reales, encontrados por Kevin probando de verdad en su iPhone (no casos hipotéticos):

    1) iOS **no comparte** localStorage entre una pestaña normal de Safari y la misma página abierta
       como app instalada (standalone) — son dos cajones de guardado separados, aunque sea el mismo
       sitio. Si acá se sacara la clave de la URL apenas se lee, "Compartir → Agregar a pantalla de
       inicio" guardaría un acceso directo SIN la clave (la URL ya habría quedado limpia para cuando
       el dedo llega al botón Compartir), y el ícono instalado quedaría mostrando "Enlace no válido"
       para siempre. Por eso la URL **solo** se limpia cuando la página ya se está ejecutando
       standalone (ahí no hay barra de direcciones que mostrar, ni "Agregar a pantalla de inicio"
       pendiente — esa URL es fija de por vida desde que se creó el ícono).

    2) La "Protección de rastreo de enlaces" de iOS (Ajustes → Safari → Avanzado → Protección de
       seguimiento avanzado) **le borra los parámetros de la URL antes de que la página cargue**
       cuando el enlace se toca desde Mail, Mensajes o en Navegación privada — no distingue "clave de
       acceso" de "parámetro de rastreo publicitario", así que un `?k=...` tocado desde el correo
       puede llegar vacío aunque el correo lo mandara bien. Esta protección actúa sobre el **query
       string** (lo que va después de `?`), no sobre el **fragmento** (lo que va después de `#`, que
       ni siquiera viaja a ningún servidor) — por eso la clave ahora viaja en el fragmento (`#k=...`).
       Se sigue aceptando `?k=...` también, por compatibilidad con un enlace viejo que ya esté
       circulando, pero un enlace nuevo debe armarse con `#k=...`.

    Contrapartida real de dejar la clave a la vista en la URL en la pestaña de Safari (hasta que se
    corre standalone): le queda en su historial. Si eso preocupa, cerrar esa pestaña (o borrar el
    historial de Safari) después de crear el ícono, o generar una clave nueva con Obras → Rotar clave
    si alguna vez se sospecha que alguien más la vio.
  -->
  <script>
    var CLAVE = (function () {
      var hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
      var queryParams = new URLSearchParams(location.search);
      var k = hashParams.get('k') || queryParams.get('k');
      var standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if (k) {
        try { localStorage.setItem('clave', k); } catch (e) {}
        if (standalone) {
          hashParams.delete('k');
          queryParams.delete('k');
          var restoHash = hashParams.toString();
          var restoQuery = queryParams.toString();
          history.replaceState(null, '', location.pathname + (restoQuery ? '?' + restoQuery : '') + (restoHash ? '#' + restoHash : ''));
        }
        return k;
      }
      try { return localStorage.getItem('clave') || ''; } catch (e) { return ''; }
    })();
  </script>
  <script src="./config.js"></script>
  <script>
  /**
   * llamar(nombreDelEndpoint, arg1, arg2...) → Promise con `data`, o error con mensaje listo para mostrar.
   * La clave del enlace se agrega sola como primer argumento.
   *
   * Dos transportes, elegidos solos según dónde corre la página (nunca se mezclan a mitad de sesión):
   * 1) Embebida en Apps Script (HtmlService, `?k=...`): usa google.script.run, como siempre.
   * 2) PWA estático (fuera de Apps Script, ver /web): no existe google.script.run, así que llama por
   *    fetch() a la misma URL /exec con accion:'apiLlamar' (ver WebApp.js → apiLlamarDesdeRed_), o por
   *    JSONP si `window.APPSCRIPT_TRANSPORTE === 'jsonp'` — respaldo por si el fetch cruzado queda
   *    bloqueado por CORS en la implementación real (ver spike en docs/INSTALACION.md). La URL y el
   *    transporte se fijan una sola vez en /web/config.js, a propósito: si el fetch fallara silencioso
   *    y cambiáramos de transporte automáticamente a mitad de camino, ya no se podría distinguir
   *    "estamos sin señal" (hay que guardar en la cola offline) de "el transporte está mal configurado".
   */
  /**
   * Acciones que, si fallan por falta de señal, se guardan en la cola offline (ver Cola.html) y
   * se reintentan solas al volver la conexión, en vez de perderse. Lista explícita a propósito
   * (no por patrón de nombre): al agregar un endpoint nuevo que escribe datos y tiene sentido
   * usar sin señal, hay que sumarlo acá también. Quedan afuera a propósito las lecturas (no
   * tiene sentido "reintentar sola" una lectura que el usuario está esperando ver ahora), lo que
   * sube archivos (apiSubirArchivo: no cabe un audio/foto grande en la cola, y otros guardados
   * dependen del id que devuelve) y los pasos de IA que muestran un borrador para revisar
   * (interpretar texto/audio, reprocesar, itemizado, sugerencias): sin señal no hay nada que
   * mostrar para revisar, así que encolarlos no ayudaría.
   */
  var ACCIONES_ENCOLABLES = {
    apiGuardarCita: 1, apiGuardarCompra: 1, apiGuardarCotizacion: 1, apiGuardarExcepcion: 1,
    apiGuardarNota: 1, apiGuardarPartida: 1, apiGuardarPartidas: 1, apiGuardarProyecto: 1,
    apiGuardarRecurso: 1, apiGuardarSubcontratista: 1, apiGuardarTarea: 1, apiGuardarTrabajador: 1,
    apiEliminarCita: 1, apiEliminarCompra: 1, apiEliminarCotizacion: 1, apiEliminarExcepcion: 1,
    apiEliminarNota: 1, apiEliminarPagoSubcontratista: 1, apiEliminarPartida: 1, apiEliminarProyecto: 1,
    apiEliminarRecurso: 1, apiEliminarSubcontratista: 1, apiEliminarTarea: 1, apiEliminarTrabajador: 1,
    apiCambiarEstadoCompra: 1, apiCambiarEstadoTarea: 1,
    apiMarcarCompraPagada: 1, apiMarcarCotizacionPagada: 1,
    apiRegistrarPagoSubcontratista: 1,
    apiAsignarSubcontratistaProyecto: 1, apiAsignarRecursos: 1,
    apiQuitarRecursoTarea: 1, apiQuitarSubcontratistaProyecto: 1,
    apiElegirCotizacion: 1, apiAckUltimoResumen: 1,
    apiIaAplicar: 1, apiIaDescartar: 1, apiIaDeshacer: 1,
    apiRegistrarTokenPush: 1, apiQuitarTokenPush: 1
  };

  function llamar(nombre) {
    var args = Array.prototype.slice.call(arguments, 1);
    return llamarSinCola_(nombre, args).catch(function (err) {
      if (ACCIONES_ENCOLABLES[nombre] && esErrorDeRed_(err) && typeof colaEncolar_ === 'function') {
        return colaEncolar_(nombre, args).then(function () {
          var e2 = new Error('Sin señal: se guardó en este teléfono y se enviará solo apenas vuelva la conexión.');
          e2.encolado = true;
          throw e2;
        });
      }
      throw err;
    });
  }

  /** El envío de verdad, sin pasar por la cola (para no reintentar la cola dentro de sí misma). */
  function llamarSinCola_(nombre, args) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      return llamarGAS_(nombre, args);
    }
    return llamarRed_(nombre, args);
  }

  /** true si el mensaje de error es el de "no hay conexión" que arma errorDeRed_ más abajo. */
  function esErrorDeRed_(err) {
    return !!(err && /^Sin conexión/.test(err.message));
  }

  function llamarGAS_(nombre, args) {
    return new Promise(function (resolver, rechazar) {
      var runner = google.script.run
        .withSuccessHandler(function (r) { resolverRespuesta_(r, resolver, rechazar); })
        .withFailureHandler(function (err) { rechazar(errorDeRed_(err)); });
      if (typeof runner[nombre] !== 'function') { rechazar(new Error('Función no disponible: ' + nombre)); return; }
      runner[nombre].apply(runner, [CLAVE].concat(args));
    });
  }

  function llamarRed_(nombre, args) {
    if (!window.APPSCRIPT_URL) return Promise.reject(new Error('Falta configurar APPSCRIPT_URL en web/config.js.'));
    if (window.APPSCRIPT_TRANSPORTE === 'jsonp') return llamarJsonp_(nombre, args);
    var cuerpo = JSON.stringify({ k: CLAVE, accion: 'apiLlamar', fn: nombre, args: args });
    return fetch(window.APPSCRIPT_URL, {
      method: 'POST',
      // text/plain a propósito: es una "solicitud simple" que no dispara el preflight OPTIONS
      // (Apps Script no lo responde). No cambiar a application/json sin agregar antes doOptions.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: cuerpo
    }).then(function (res) { return res.json(); })
      .then(function (r) { return new Promise(function (resolver, rechazar) { resolverRespuesta_(r, resolver, rechazar); }); }, function (err) { throw errorDeRed_(err); });
  }

  var __jsonpN = 0;
  /** Respaldo si el fetch cruzado quedara bloqueado por CORS: un <script src> no está sujeto a esa política.
   *  Por eso solo sirve para GET, y los argumentos viajan en la URL (no usar para audios/archivos grandes). */
  function llamarJsonp_(nombre, args) {
    return new Promise(function (resolver, rechazar) {
      var cb = '__jsonp' + (++__jsonpN) + '_' + Date.now();
      var url = window.APPSCRIPT_URL + '?accion=apiLlamar&k=' + encodeURIComponent(CLAVE) +
        '&fn=' + encodeURIComponent(nombre) + '&args=' + encodeURIComponent(JSON.stringify(args)) + '&callback=' + cb;
      if (url.length > 1800) { rechazar(new Error('Esta acción es muy grande para el modo de respaldo (JSONP). Necesita fetch() directo.')); return; }
      var script = document.createElement('script');
      var limpiar = function () {
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);
      };
      window[cb] = function (r) { limpiar(); resolverRespuesta_(r, resolver, rechazar); };
      script.onerror = function () { limpiar(); rechazar(new Error('Sin conexión. Revisa la señal e intenta de nuevo.')); };
      script.src = url;
      document.head.appendChild(script);
    });
  }

  function resolverRespuesta_(r, resolver, rechazar) {
    if (r && r.ok) resolver(r.data);
    else {
      var e = new Error(r && r.error ? r.error : 'Respuesta inválida del servidor.');
      e.codigo = r && r.codigo;
      rechazar(e);
    }
  }

  function errorDeRed_(err) {
    var msg = String(err && err.message || err || '');
    if (/NetworkError|network|conexi|fetch|failed/i.test(msg)) msg = 'Sin conexión. Revisa la señal e intenta de nuevo.';
    else if (/timed out|tiempo/i.test(msg)) msg = 'Se demoró demasiado. Intenta de nuevo.';
    else if (!msg) msg = 'No se pudo conectar con la app.';
    return new Error(msg);
  }
</script>

  <script>
  /**
   * Cola offline (Ronda 5, tarea #37): cuando una acción que escribe datos (guardar, eliminar,
   * cambiar estado...) falla por falta de señal, en vez de perderse se guarda acá (IndexedDB, en
   * este teléfono) y se reintenta sola al volver la conexión, o al reabrir/volver a la app.
   *
   * iOS Safari NO tiene Background Sync real (no hay forma de que el sistema despierte la app
   * en segundo plano solo para reintentar) — por eso el reintento pasa por el evento 'online' y
   * por "volver a poner la app en pantalla" (visibilitychange, ver App.html), no por nada que
   * funcione con el teléfono guardado en el bolsillo y la app cerrada del todo.
   *
   * Qué se encola: ver ACCIONES_ENCOLABLES en ApiCliente.html — es una lista explícita a propósito
   * (no por patrón de nombre), para no encolar por error una lectura o un paso que necesita
   * respuesta inmediata (por ejemplo, subir una foto, o pedirle a la IA que interprete un audio).
   */
  var COLA_DB = 'colaObras', COLA_STORE = 'pendientes', COLA_VERSION = 1;
  var COLA_MAX_INTENTOS = 20; // si tras esto sigue "sin señal", puede que en realidad esté mal
                              // configurado (no una falta de señal real) — se avisa en vez de
                              // reintentar para siempre en silencio.
  var colaDbPromesa_ = null;

  function colaAbrir_() {
    if (colaDbPromesa_) return colaDbPromesa_;
    colaDbPromesa_ = new Promise(function (resolver, rechazar) {
      if (!('indexedDB' in window)) { rechazar(new Error('Este navegador no puede guardar acciones sin conexión.')); return; }
      var req = indexedDB.open(COLA_DB, COLA_VERSION);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(COLA_STORE)) {
          db.createObjectStore(COLA_STORE, { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = function () { resolver(req.result); };
      req.onerror = function () { rechazar(req.error || new Error('No se pudo abrir el guardado local.')); };
    });
    return colaDbPromesa_;
  }

  function colaTx_(modo, fn) {
    return colaAbrir_().then(function (db) {
      return new Promise(function (resolver, rechazar) {
        var tx = db.transaction(COLA_STORE, modo);
        var resultado;
        fn(tx.objectStore(COLA_STORE), function (r) { resultado = r; });
        tx.oncomplete = function () { resolver(resultado); };
        tx.onerror = function () { rechazar(tx.error || new Error('No se pudo usar el guardado local.')); };
      });
    });
  }

  function colaEncolar_(nombre, args) {
    return colaTx_('readwrite', function (store) {
      store.add({ nombre: nombre, args: args, creado: Date.now(), intentos: 0 });
    }).then(function () { return colaNotificar_(); });
  }

  function colaListar_() {
    return colaTx_('readonly', function (store, guardar) {
      store.getAll().onsuccess = function (e) { guardar(e.target.result || []); };
    });
  }

  function colaQuitar_(id) {
    return colaTx_('readwrite', function (store) { store.delete(id); });
  }

  function colaMarcarIntento_(registro) {
    registro.intentos = (registro.intentos || 0) + 1;
    return colaTx_('readwrite', function (store) { store.put(registro); }).then(function () { return registro.intentos; });
  }

  /** Cantidad de acciones esperando señal (para el globo junto al micrófono). */
  function colaContar() {
    if (!('indexedDB' in window)) return Promise.resolve(0);
    return colaListar_().then(function (r) { return r.length; }).catch(function () { return 0; });
  }

    var fechas = p.fechaInicio || p.fechaTermino

    if (f === 'resueltas') h.push('<p class="ayuda">Se muestran las resueltas de los últimos 14 días.</p>');
    return h.join('');
  };

  ACC.modoTareas = function (el) { S.vistaTareasModo = el.dataset.m; render(true); };

  // ---------- Carta Gantt ----------

  function diffDias(a, b) { return Math.round((aDate(b) - aDate(a)) / 86400000); }

  /** tareas: ya vienen ordenadas por fechaInicio. Dibuja etiquetas a la izquierda y barras con scroll horizontal a la derecha. */
  function gantt(tareas) {
    var hoy = S.d.hoy;
    var anchoDia = 26, altoFila = 44;
    var min = tareas.reduce(function (m, t) { return t.fechaInicio < m ? t.fechaInicio : m; }, hoy);
    var max = tareas.reduce(function (m, t) { return (t.fechaTermino || t.fechaInicio) > m ? (t.fechaTermino || t.fechaInicio) : m; }, hoy);
    min = sumarDias(min, -1);
    max = sumarDias(max, 2);
    var totalDias = diffDias(min, max) + 1;

    var cabeceraDias = [];
    for (var i = 0; i < totalDias; i++) {
      var f = sumarDias(min, i);
      var dow = aDate(f).getUTCDay();
      cabeceraDias.push('<div class="gantt-dia' + (dow === 0 || dow === 6 ? ' finde' : '') + (f === hoy ? ' hoy' : '') + '">' +
        '<span>' + DIAS[dow] + '</span><b>' + f.slice(8, 10) + '</b></div>');
    }

    var etiquetas = tareas.map(function (t) {
      return '<div class="gantt-fila-nombre' + (t.estado === 'resuelta' ? ' resuelta' : '') + '">' +
        '<button class="gantt-check" data-a="toggleTarea" data-id="' + t.id + '" aria-label="' +
        (t.estado === 'resuelta' ? 'Marcar pendiente' : 'Marcar resuelta') + '"><span>✓</span></button>' +
        '<button class="gantt-titulo" data-a="verTarea" data-id="' + t.id + '">' + esc(t.titulo) + '</button></div>';
    }).join('');

    var barras = tareas.map(function (t, i) {
      var fin = t.fechaTermino || t.fechaInicio;
      var offset = diffDias(min, t.fechaInicio) * anchoDia;
      var ancho = Math.max(1, diffDias(t.fechaInicio, fin) + 1) * anchoDia - 4;
      var extra = t.estado === 'resuelta' ? ' resuelta' : (abierta(t) && fin < hoy ? ' atrasada' : (t.estado === 'en_curso' ? ' en-curso' : ''));
      return '<button class="gantt-barra' + extra + '" style="left:' + (offset + 2) + 'px;top:' + (i * altoFila + 6) + 'px;width:' + ancho + 'px" ' +
        'data-a="verTarea" data-id="' + t.id + '"><span>' + esc(t.titulo) + '</span></button>';
    }).join('');

    var hoyOffset = diffDias(min, hoy) * anchoDia;

    return '<div class="gantt">' +
      '<div class="gantt-nombres"><div class="gantt-cabecera-esp"></div>' + etiquetas + '</div>' +
      '<div class="gantt-scroll"><div style="width:' + (totalDias * anchoDia) + 'px">' +
      '<div class="gantt-cabecera">' + cabeceraDias.join('') + '</div>' +
      '<div class="gantt-pistas" style="height:' + (tareas.length * altoFila) + 'px;background-size:' + (totalDias * anchoDia) + 'px ' + altoFila + 'px">' +
      '<div class="gantt-hoy" style="left:' + hoyOffset + 'px"></div>' + barras + '</div></div></div></div>';
  }

  // ---------- Bitácora de obra ----------

  /** Línea de tiempo con tareas resueltas, notas, fotos subidas y compras completadas del proyecto. */
  PESTANA.bitacora = function (p) {
    var det = detalle(p.id);
    if (!det) return vacio('Cargando…');
    var items = [];
    det.tareasResueltas.forEach(function (t) {
      items.push({ fecha: t.resueltaEn || t.actualizadoEn, tipo: 'tarea',
        html: '<span class="bit-icono">✓</span><div class="bit-cuerpo"><strong>' + esc(t.titulo) + '</strong><span class="bit-meta">Tarea resuelta</span></div>' });
    });
    det.notas.forEach(function (n) {
      items.push({ fecha: n.creadoEn, tipo: 'nota',
        html: '<span class="bit-icono">📝</span><div class="bit-cuerpo"><p>' + esc(n.texto) + '</p>' +
          '<span class="bit-meta">Nota' + (n.origen !== 'manual' ? ' (por voz)' : '') + '</span></div>' });
    });
    det.archivos.forEach(function (a) {
      var esFoto = a.tipo === 'foto';
      items.push({ fecha: a.subidoEn, tipo: 'archivo',
        html: '<span class="bit-icono">' + (esFoto ? '🖼' : '📎') + '</span><div class="bit-cuerpo"><strong>' + esc(esFoto ? 'Foto subida' : (a.nombre || 'Archivo subido')) + '</strong>' +
          (esFoto ? '' : '<span class="bit-meta">' + esc(a.nombre) + '</span>') + '</div>' });
    });
    det.comprasCompradas.forEach(function (c) {
      items.push({ fecha: c.compradaEn, tipo: 'compra',
        html: '<span class="bit-icono">🛒</span><div class="bit-cuerpo"><strong>' + esc(c.descripcion) + '</strong>' +
          '<span class="bit-meta">Compra' + (c.montoClp ? ', ' + esc(pesos(c.montoClp)) : '') + '</span></div>' });
    });
    if (!items.length) return vacio('Aún no hay nada en la bitácora. Aquí van apareciendo las tareas resueltas, notas, fotos y compras de este proyecto.');
    items.sort(function (a, b) { return String(a.fecha) < String(b.fecha) ? 1 : -1; });
    var porDia = {}, orden = [];
    items.forEach(function (it) {
      var dia = String(it.fecha || '').slice(0, 10);
      if (!porDia[dia]) { porDia[dia] = []; orden.push(dia); }
      porDia[dia].push(it);
    });
    return orden.map(function (dia) {
      return '<h3 class="bit-dia">' + esc(dia ? fechaLarga(dia) : 'Sin fecha') + '</h3>' +
        '<div class="bitacora">' + porDia[dia].map(function (it) { return '<div class="bit-item bit-' + it.tipo + '">' + it.html + '</div>'; }).join('') + '</div>';
    }).join('');
  };

  PESTANA.itemizado = function (p) {
    var det = detalle(p.id);
    var h = ['<div class="barra-botones"><button class="btn btn-primario" data-a="cargarItemizado" data-proyecto="' + p.id + '">Cargar itemizado</button>'];
    if (det && det.partidas.length) h.push('<button class="btn" data-a="proponerTareas" data-proyecto="' + p.id + '">Proponer tareas con IA</button>');
    h.push('</div>');
    if (!det) return h.join('') + vacio('Cargando…');
    if (!det.partidas.length) return h.join('') + vacio('Sin itemizado. Súbelo como foto, PDF o texto y la IA lo lee por ti.');
    var total = det.partidas.reduce(function (s, x) { return s + (Number(x.total) || 0); }, 0);
    h.push('<div class="tabla-wrap"><table class="partidas"><thead><tr><th>Ítem</th><th>Descripción</th><th class="num">Cant.</th><th class="num">Total</th></tr></thead><tbody>');
    det.partidas.forEach(function (x) {
      var capitulo = x.cantidad === null && x.total === null;

        '<td>' + esc(x.codigo) + '</td><td>' + esc(x.descripcion) + '</td>' +
        '<td class="num">' + (x.cantidad !== null ? esc(numero(x.cantidad) + ' ' + (x.unidad || '')) : '') + '</td>' +
        '<td class="num">' + esc(pesos(x.total)) + '</td></tr>');
    });
    h.push('</tbody></table></div><div class="total-linea"><span>Total partidas</span><span>' + esc(pesos(total)) + '</span></div>');

  PESTANA.compras = function (p) {
    var lista = S.d.compras.filter(function (c) { return c.proyectoId === p.id; });
    var h = ['<div class="barra-botones"><button class="btn btn-primario" data-a="nuevaCompra" data-proyecto="' + p.id + '">Nueva compra</button></div>'];
    if (!lista.length) return h.join('') + vacio('No hay compras pendientes ni recientes en este proyecto.');
    [['aprobada', 'Por comprar'], ['sugerida', 'Sugeridas'], ['comprada', 'Compradas']].forEach(function (x) {
      var grupo = lista.filter(function (c) { return c.estado === x[0]; });
      if (!grupo.length) return;
      h.push(seccion(x[1], grupo.length));
      h.push('<div class="lista">' + grupo.map(itemCompra).join('') + '</div>');
    });
    return h.join('');

  /** Total neto y con IVA a partir de un monto que puede venir con o sin IVA incluido. */
  function calcularConIva(monto, incluyeIva) {
    var tasa = (S.d.config.ivaTasa || 19) / 100;
    return {
      neto: incluyeIva ? monto / (1 + tasa) : monto,
      conIva: incluyeIva ? monto : monto * (1 + tasa)
    };
  }

  /**
   * Calcula el trato pactado con un subcontratista en un proyecto (SubcontratistasProyectos):
   * total con y sin IVA, lo pagado hasta ahora y el saldo pendiente. Si no hay monto acordado
   * (link.montoTrato vacío), devuelve null.
   */
  function calcTrato(link) {
    var monto = Number(link.montoTrato) || 0;
    if (!monto) return null;
    var iva = calcularConIva(monto, link.incluyeIva);
    var pagado = S.d.pagosSubcontratistas.filter(function (r) {
      return r.subcontratistaId === link.subcontratistaId && r.proyectoId === link.proyectoId && !r.tareaId;
    }).reduce(function (s, r) { return s + (Number(r.monto) || 0); }, 0);
    var saldo = iva.conIva - pagado;
    return { neto: iva.neto, conIva: iva.conIva, pagado: pagado, saldo: saldo, pct: iva.conIva ? Math.round((pagado / iva.conIva) * 100) : 0 };
  }

  /** Línea de texto con el trato (o solo lo pagado, si no hay monto acordado). */
  function textoTrato(link) {
    var t = calcTrato(link);
    if (!t) {
      var pagado = S.d.pagosSubcontratistas.filter(function (x) { return x.subcontratistaId === link.subcontratistaId && x.proyectoId === link.proyectoId && !x.tareaId; })
        .reduce(function (s, x) { return s + (Number(x.monto) || 0); }, 0);
      return pagado ? 'Pagado ' + pesos(pagado) : '';
    }
    var acordado = link.incluyeIva ? 'Acordado ' + pesos(t.conIva) + ' (incluye IVA)' : 'Acordado ' + pesos(t.neto) + ' + IVA = ' + pesos(t.conIva);
    var saldoTxt = t.saldo > 0.5 ? 'saldo ' + pesos(t.saldo) : (t.saldo < -0.5 ? 'pagado de más ' + pesos(-t.saldo) : 'sin saldo');
    return acordado + ' · pagado ' + pesos(t.pagado) + ' (' + t.pct + '%) · ' + saldoTxt;
  }

  /**
   * Igual que calcTrato pero para una cotización elegida a nivel de tarea: los pagos se filtran
   * por tareaId (no por proyectoId), así el seguimiento de una tarea puntual queda separado del
   * trato general del subcontratista con el proyecto, aunque compartan la misma tabla de pagos.
   */
  function calcTratoCotizacion(cot) {
    var monto = Number(cot.monto) || 0;
    if (!monto) return null;
    var iva = calcularConIva(monto, cot.incluyeIva);
    var pagado = S.d.pagosSubcontratistas.filter(function (r) {
      return r.tareaId === cot.tareaId && r.subcontratistaId === cot.subcontratistaId;
    }).reduce(function (s, r) { return s + (Number(r.monto) || 0); }, 0);
    var saldo = iva.conIva - pagado;
    return { neto: iva.neto, conIva: iva.conIva, pagado: pagado, saldo: saldo, pct: iva.conIva ? Math.round((pagado / iva.conIva) * 100) : 0 };
  }

  /** Línea de texto con el trato de una cotización elegida (monto, IVA, pagado y saldo). */
  function textoTratoCotizacion(cot) {
    var t = calcTratoCotizacion(cot);
    // Ronda 10: una cotización en 0 (el subcontratista hace esta tarea pero el cobro real está
    // cargado en otra) no tiene trato que mostrar — antes esto quedaba en blanco (un espacio vacío
    // con estilo, en el listado); ahora se deja explícito para que no parezca un dato faltante.
    if (!t) return 'Sin cobro aparte por esta tarea';
    var acordado = cot.incluyeIva ? 'Acordado ' + pesos(t.conIva) + ' (incluye IVA)' : 'Acordado ' + pesos(t.neto) + ' + IVA = ' + pesos(t.conIva);
    var saldoTxt = t.saldo > 0.5 ? 'saldo ' + pesos(t.saldo) : (t.saldo < -0.5 ? 'pagado de más ' + pesos(-t.saldo) : 'sin saldo');
    return acordado + ' · pagado ' + pesos(t.pagado) + ' (' + t.pct + '%) · ' + saldoTxt;
  }

  /**
   * Fila "hija" con una tarea puntual de un subcontratista sin trato de proyecto (pestaña
   * Subcontratos, Ronda 8): título de la tarea (abre verTarea), estado de pago/saldo (mismo texto
   * que en la propia tarea) y los mismos botones Pagar/Finalizar pago/Editar, para no obligar a
   * abrir la tarea solo para ver o registrar un pago.
   */
  function filaCotizacionTarea(x) {
    var c = x.cotizacion, t = x.tarea;
    var acciones = c.pagado
      ? '<span class="chip chip-verde">Pago finalizado</span>'
      : '<button class="btn btn-chico" data-a="pagarCotizacion" data-id="' + c.id + '">Pagar</button>' +
        '<button class="btn btn-chico btn-plano" data-a="finalizarPagoCotizacion" data-id="' + c.id + '">Finalizar pago</button>';
    var titulo = t
      ? '<button class="btn btn-plano btn-chico" style="padding:0;font-weight:600" data-a="verTarea" data-id="' + t.id + '">' + esc(t.titulo) + '</button>'
      : 'Tarea eliminada';
    return '<div class="item item-anidado"><span class="principal"><span class="nombre">' + titulo + '</span>' +
      '<span class="detalle">' + esc(textoTratoCotizacion(c)) + '</span></span>' +
      '<span class="acciones">' + acciones +
      '<button class="btn btn-chico btn-plano" data-a="editarCotizacion" data-id="' + c.id + '" aria-label="Editar">Editar</button></span></div>';
  }

  /** Línea "N tareas en este proyecto (título, título…)" a partir de cotizacionesElegidas de detalle_. */
  function resumenTareasSub(lista) {
    if (!lista || !lista.length) return '';
    var titulos = lista.map(function (x) { return x.tarea ? x.tarea.titulo : null; }).filter(Boolean);
    var extra = titulos.length > 2 ? ' y ' + (titulos.length - 2) + ' más' : '';
    return lista.length + ' tarea' + (lista.length === 1 ? '' : 's') + ' en este proyecto' +
      (titulos.length ? ' (' + titulos.slice(0, 2).join(', ') + extra + ')' : '');
  }

  PESTANA.subcontratos = function (p) {
    var links = S.d.subcontratistasProyectos.filter(function (r) { return r.proyectoId === p.id; });
    var h = [];
    if (!S.d.subcontratistas.length) {
      h.push(vacio('Aún no tienes subcontratistas en tu catálogo.'));
      h.push('<div class="barra-botones"><button class="btn btn-primario" data-a="ir" data-vista="subcontratistas">Agregar subcontratista</button></div>');
      return h.join('');
    }
    var det = detalle(p.id);
    // Subcontratistas con una tarea puntual asignada en este proyecto (cotización elegida) aunque
    // nunca se les haya "Asignado" al proyecto a mano — pedido de Kevin, para no tener que agregarlos
    // manualmente y para ver de un vistazo cuántas tareas tiene cada uno aquí.
    var porSub = {};
    if (det) {
      det.cotizacionesElegidas.forEach(function (x) {
        (porSub[x.cotizacion.subcontratistaId] = porSub[x.cotizacion.subcontratistaId] || []).push(x);
      });
    }
    var asignadosIds = links.map(function (r) { return r.subcontratistaId; });
    var soloPorTareas = Object.keys(porSub).filter(function (id) { return asignadosIds.indexOf(id) < 0; });
    var disponibles = S.d.subcontratistas.filter(function (s) { return s.activo && asignadosIds.indexOf(s.id) < 0; });
    if (disponibles.length) {
      h.push('<form data-form="asignarSubProyecto"><input type="hidden" name="proyectoId" value="' + p.id + '">' +
        campo('Asignar subcontratista', selector('subcontratistaId', disponibles.map(function (s) { return [s.id, s.nombre + ' (' + s.especialidad + ')']; }), '')) +
        campo('Cómo resultó (opcional)', input('nota', '', 'maxlength="500" placeholder="Buena relación, cumplió los plazos…"')) +
        '<button type="submit" class="btn btn-primario">Asignar</button></form>');
    }
    if (!links.length && !soloPorTareas.length) return h.join('') + vacio('No hay subcontratistas asignados a este proyecto.');
    h.push('<div class="lista">' + links.map(function (r) {
      var s = porId(S.d.subcontratistas, r.subcontratistaId);
      var detalleTxt = [s && s.especialidad, r.nota].filter(Boolean).join(' — ');
      var trato = textoTrato(r);
      var tareasTxt = resumenTareasSub(porSub[r.subcontratistaId]);
      return '<div class="item"><span class="principal"><span class="nombre">' + esc(s ? s.nombre : 'Subcontratista eliminado') + '</span>' +
        (detalleTxt ? '<span class="detalle">' + esc(detalleTxt) + '</span>' : '') +
        (trato ? '<span class="detalle">' + esc(trato) + '</span>' : '') +
        (tareasTxt ? '<span class="detalle">' + esc(tareasTxt) + '</span>' : '') + '</span>' +
        '<span class="acciones"><button class="btn btn-chico" data-a="asignarSubTarea" data-sub="' + r.subcontratistaId + '" data-proyecto="' + p.id + '">A una tarea</button>' +
        '<button class="btn btn-chico" data-a="pagarSubProyecto" data-sub="' + r.subcontratistaId + '" data-proyecto="' + p.id + '">Pagar</button>' +
        '<button class="btn btn-chico btn-plano" data-a="editarTratoSub" data-id="' + r.id + '" aria-label="Editar trato">Trato</button>' +
        '<button class="btn btn-chico btn-plano" data-a="quitarSubcontratistaProyecto" data-id="' + r.id + '" aria-label="Quitar">✕</button></span></div>';
    }).join('') + soloPorTareas.map(function (subId) {
      var s = porId(S.d.subcontratistas, subId);
      // Ronda 8 (pedido de Kevin): antes esto resumía todas las tareas en una sola línea, sin poder
      // ver ni pagar desde acá — ahora cada tarea de este subcontratista aparece como su propia fila,
      // con el mismo estado de pago/saldo y los mismos botones Pagar/Finalizar/Editar que tiene desde
      // la propia tarea (verTarea), para no tener que ir a buscarla aparte solo para eso.
      var cabecera = '<div class="item"><span class="principal"><span class="nombre">' + esc(s ? s.nombre : 'Subcontratista eliminado') + '</span>' +
        '<span class="detalle">' + esc(resumenTareasSub(porSub[subId])) + ' — sin trato de proyecto pactado</span></span>' +
        '<span class="acciones"><button class="btn btn-chico" data-a="asignarSubTarea" data-sub="' + subId + '" data-proyecto="' + p.id + '">A otra tarea</button></span></div>';
      var filas = (porSub[subId] || []).map(function (x) { return filaCotizacionTarea(x); }).join('');
      return cabecera + filas;
    }).join('') + '</div>');
    return h.join('');
  };

  PESTANA.archivos = function (p) {

      '<button class="btn btn-primario" data-a="subirArchivo" data-tipo="foto" data-proyecto="' + p.id + '">Subir fotos</button>' +

  PESTANA.datos = function (p) {

  function tareasDeTrabajador(trabajadorId, fecha) {
    var ids = S.d.asignaciones.filter(function (a) { return a.trabajadorId === trabajadorId; }).map(function (a) { return a.tareaId; });
    return S.d.tareas.filter(function (t) {
      var p = proyecto(t.proyectoId);
      return ids.indexOf(t.id) >= 0 && abierta(t) && p && p.estado === 'activo' &&
        t.fechaInicio <= fecha && (t.fechaTermino || t.fechaInicio) >= fecha;
    });

  function telefonoWhatsApp(tel) {
    var n = String(tel || '').replace(/\D/g, '');
    if (n.length === 9 && n.charAt(0) === '9') n = '56' + n;
    if (n.length === 8) n = '569' + n;
    return n;
  }

  function enlaceWhatsApp(t, fecha) {
    var tareas = tareasDeTrabajador(t.id, fecha);
    var cuando = fecha === S.d.hoy ? 'hoy' : 'mañana ' + etiqueta(fecha);
    var lineas = ['Hola ' + nombreCorto(t.nombre) + ', tus tareas para ' + cuando + ':'];
    if (!tareas.length) lineas = ['Hola ' + nombreCorto(t.nombre) + ', para ' + cuando + ' no tienes tareas asignadas.'];
    var por = {};
    tareas.forEach(function (x) { (por[x.proyectoId] = por[x.proyectoId] || []).push(x); });
    Object.keys(por).forEach(function (pid) {

      lineas.push('', '*' + (p ? p.nombre : '') + '*' + (p && p.direccion ? ' (' + p.direccion + ')' : ''));
      por[pid].forEach(function (x) { lineas.push('- ' + x.titulo); });
    });
    return 'https://wa.me/' + telefonoWhatsApp(t.telefono) + '?text=' + encodeURIComponent(lineas.join('\n'));
